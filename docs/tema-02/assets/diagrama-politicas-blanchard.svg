<svg viewBox="0 0 760 390" role="img" aria-labelledby="fig-pol-title fig-pol-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="fig-pol-title">El método de los 3 pasos de Blanchard: Choque fiscal vs Choque monetario</title>
  <desc id="fig-pol-desc">Comparativa en dos paneles ampliados. Panel izquierdo: Política fiscal contractiva donde la curva IS se desplaza a la izquierda y la economía se mueve a lo largo de la LM horizontal, reduciendo Y sin alterar la tasa de interés. Panel derecho: Política monetaria expansiva donde la curva LM baja a un nivel de tasa menor y la economía se mueve a lo largo de la curva IS, reduciendo la tasa de interés y aumentando el producto.</desc>

  <!-- Panel Izquierdo: Choque Fiscal -->
  <rect x="6" y="6" width="368" height="378" rx="12" fill="#10172D" stroke="#2A324A" stroke-width="1.2"/>
  <rect x="20" y="18" width="340" height="24" rx="5" fill="#1B223C"/>
  <text x="190" y="35" text-anchor="middle" font-family="Inter" font-weight="700" font-size="11.5" fill="#FFB188">CASO 1: POLÍTICA FISCAL (&#8593;T &#243; &#8595;G)</text>

  <!-- Retícula panel izquierdo -->
  <path d="M55 105H345M55 150H345M55 195H345" fill="none" stroke="#2A324A" stroke-width="1" stroke-dasharray="4 5" opacity=".25"/>
  <path d="M150 55V240M240 55V240" fill="none" stroke="#2A324A" stroke-width="1" stroke-dasharray="4 5" opacity=".2"/>

  <!-- Sombreado de desplazamiento fiscal -->
  <path d="M 85 75 C 115 110, 150 150, 225 215 L 310 215 C 235 150, 180 110, 130 75 Z" fill="#FF6F4A" fill-opacity="0.08"/>

  <!-- Proyecciones ortogonales panel izquierdo -->
  <line x1="55" y1="150" x2="240" y2="150" stroke="#667FDA" stroke-width="1.4" stroke-dasharray="3 3" opacity=".6"/>
  <line x1="150" y1="150" x2="150" y2="240" stroke="#FFB188" stroke-width="1.4" stroke-dasharray="3 3" opacity=".75"/>
  <line x1="240" y1="150" x2="240" y2="240" stroke="#A3AABE" stroke-width="1.4" stroke-dasharray="3 3" opacity=".65"/>

  <!-- Ejes panel izquierdo -->
  <line x1="55" y1="55" x2="55" y2="240" stroke="#A3AABE" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="55" y1="240" x2="350" y2="240" stroke="#A3AABE" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M50 63L55 53L60 63" fill="none" stroke="#A3AABE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M342 235L350 240L342 245" fill="none" stroke="#A3AABE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Títulos ejes izquierdo -->
  <rect x="30" y="50" width="22" height="18" rx="3" fill="#10172D"/>
  <text x="41" y="63" text-anchor="middle" font-family="Inter" font-weight="700" font-size="12" fill="#EFF2F9">i</text>
  <rect x="342" y="245" width="22" height="18" rx="3" fill="#10172D"/>
  <text x="353" y="258" text-anchor="middle" font-family="Inter" font-weight="700" font-size="12" fill="#EFF2F9">Y</text>

  <!-- Coordenadas en ejes panel izquierdo -->
  <rect x="18" y="141" width="34" height="18" rx="3" fill="#10172D"/>
  <text x="35" y="154" text-anchor="middle" font-family="JetBrains Mono" font-size="11" fill="#667FDA">i*</text>

  <rect x="135" y="245" width="32" height="18" rx="3" fill="#10172D"/>
  <text x="151" y="258" text-anchor="middle" font-family="JetBrains Mono" font-size="11" fill="#FFB188">Y&#8242;</text>

  <rect x="226" y="245" width="28" height="18" rx="3" fill="#10172D"/>
  <text x="240" y="258" text-anchor="middle" font-family="JetBrains Mono" font-size="11" fill="#A3AABE">Y</text>

  <!-- Curva LM (horizontal e inalterada) -->
  <line x1="65" y1="150" x2="310" y2="150" stroke="#667FDA" stroke-width="3.6" stroke-linecap="round"/>
  <rect x="316" y="139" width="34" height="22" rx="4" fill="#10172D" stroke="#667FDA" stroke-width="1"/>
  <text x="333" y="154" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="11.5" fill="#667FDA">LM</text>

  <!-- Curva IS' desplazada -->
  <path d="M 85 75 C 115 110, 150 150, 225 215" fill="none" stroke="#FFB188" stroke-width="2.4" stroke-dasharray="5 4" opacity=".95"/>
  <rect x="68" y="60" width="32" height="20" rx="3" fill="#10172D" stroke="#FFB188" stroke-width="0.9"/>
  <text x="84" y="74" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="11" fill="#FFB188">IS&#8242;</text>

  <!-- Curva IS original -->
  <path d="M 130 75 C 180 110, 235 150, 310 215" fill="none" stroke="#FF6F4A" stroke-width="3.6" stroke-linecap="round"/>
  <rect x="306" y="205" width="30" height="20" rx="3" fill="#10172D" stroke="#FF6F4A" stroke-width="0.9"/>
  <text x="321" y="219" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="11.5" fill="#FF6F4A">IS</text>

  <!-- Vector dinámico A -> A' sobre LM -->
  <line x1="225" y1="150" x2="168" y2="150" stroke="#FFB188" stroke-width="2.2" stroke-dasharray="3 2"/>
  <path d="M176 145L167 150L176 155" fill="none" stroke="#FFB188" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Nodos panel izquierdo -->
  <circle cx="240" cy="150" r="9" fill="#10172D" stroke="#EFF2F9" stroke-width="2.4"/>
  <circle cx="240" cy="150" r="3.8" fill="#FF6F4A"/>
  <rect x="248" y="130" width="24" height="20" rx="3" fill="#10172D" stroke="#2A324A" stroke-width="0.8"/>
  <text x="260" y="144" text-anchor="middle" font-family="Inter" font-weight="700" font-size="11" fill="#EFF2F9">A</text>

  <circle cx="150" cy="150" r="9" fill="#10172D" stroke="#FFB188" stroke-width="2.4"/>
  <circle cx="150" cy="150" r="3.8" fill="#FFB188"/>
  <rect x="116" y="130" width="26" height="20" rx="3" fill="#10172D" stroke="#FFB188" stroke-width="0.8"/>
  <text x="129" y="144" text-anchor="middle" font-family="Inter" font-weight="700" font-size="11" fill="#FFB188">A&#8242;</text>

  <!-- Desglose de 3 pasos panel izquierdo -->
  <rect x="18" y="275" width="344" height="95" rx="6" fill="#1B223C" stroke="#2A324A" stroke-width="0.8"/>
  <text x="28" y="295" font-family="JetBrains Mono" font-size="10" font-weight="700" fill="#FFB188">1. PASO 1:</text>
  <text x="90" y="295" font-family="Inter" font-size="10" fill="#EFF2F9">IS se desplaza a la izquierda (&#8595;Z)</text>
  <text x="28" y="322" font-family="JetBrains Mono" font-size="10" font-weight="700" fill="#667FDA">2. PASO 2:</text>
  <text x="90" y="322" font-family="Inter" font-size="10" fill="#EFF2F9">A &#8594; A&#8242; a lo largo de LM (i* fija, &#8595;Y)</text>
  <text x="28" y="349" font-family="JetBrains Mono" font-size="10" font-weight="700" fill="#55C975">3. PASO 3:</text>
  <text x="90" y="349" font-family="Inter" font-size="10" fill="#EFF2F9">Menor Y &#8658; C cae, I cae por menor venta</text>

  <!-- Panel Derecho: Choque Monetario -->
  <rect x="386" y="6" width="368" height="378" rx="12" fill="#10172D" stroke="#2A324A" stroke-width="1.2"/>
  <rect x="400" y="18" width="340" height="24" rx="5" fill="#1B223C"/>
  <text x="570" y="35" text-anchor="middle" font-family="Inter" font-weight="700" font-size="11.5" fill="#667FDA">CASO 2: POLÍTICA MONETARIA (&#8595;i*)</text>

  <!-- Retícula panel derecho -->
  <path d="M435 120H725M435 185H725" fill="none" stroke="#2A324A" stroke-width="1" stroke-dasharray="4 5" opacity=".25"/>
  <path d="M520 55V240M620 55V240" fill="none" stroke="#2A324A" stroke-width="1" stroke-dasharray="4 5" opacity=".2"/>

  <!-- Sombreado de desplazamiento monetario -->
  <rect x="435" y="120" width="265" height="65" fill="#667FDA" fill-opacity="0.06"/>

  <!-- Proyecciones ortogonales panel derecho -->
  <line x1="435" y1="120" x2="520" y2="120" stroke="#A3AABE" stroke-width="1.4" stroke-dasharray="3 3" opacity=".6"/>
  <line x1="435" y1="185" x2="620" y2="185" stroke="#667FDA" stroke-width="1.4" stroke-dasharray="3 3" opacity=".7"/>
  <line x1="520" y1="120" x2="520" y2="240" stroke="#A3AABE" stroke-width="1.4" stroke-dasharray="3 3" opacity=".6"/>
  <line x1="620" y1="185" x2="620" y2="240" stroke="#667FDA" stroke-width="1.4" stroke-dasharray="3 3" opacity=".7"/>

  <!-- Ejes panel derecho -->
  <line x1="435" y1="55" x2="435" y2="240" stroke="#A3AABE" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="435" y1="240" x2="730" y2="240" stroke="#A3AABE" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M430 63L435 53L440 63" fill="none" stroke="#A3AABE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M722 235L730 240L722 245" fill="none" stroke="#A3AABE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Títulos ejes derecho -->
  <rect x="410" y="50" width="22" height="18" rx="3" fill="#10172D"/>
  <text x="421" y="63" text-anchor="middle" font-family="Inter" font-weight="700" font-size="12" fill="#EFF2F9">i</text>
  <rect x="722" y="245" width="22" height="18" rx="3" fill="#10172D"/>
  <text x="733" y="258" text-anchor="middle" font-family="Inter" font-weight="700" font-size="12" fill="#EFF2F9">Y</text>

  <!-- Coordenadas panel derecho -->
  <rect x="398" y="111" width="34" height="18" rx="3" fill="#10172D"/>
  <text x="415" y="124" text-anchor="middle" font-family="JetBrains Mono" font-size="11" fill="#A3AABE">i*</text>

  <rect x="398" y="176" width="34" height="18" rx="3" fill="#10172D"/>
  <text x="415" y="189" text-anchor="middle" font-family="JetBrains Mono" font-size="11" fill="#667FDA">i*&#8242;</text>

  <rect x="506" y="245" width="28" height="18" rx="3" fill="#10172D"/>
  <text x="520" y="258" text-anchor="middle" font-family="JetBrains Mono" font-size="11" fill="#A3AABE">Y</text>

  <rect x="604" y="245" width="32" height="18" rx="3" fill="#10172D"/>
  <text x="620" y="258" text-anchor="middle" font-family="JetBrains Mono" font-size="11" fill="#667FDA">Y&#8242;</text>

  <!-- Curva LM original -->
  <line x1="445" y1="120" x2="690" y2="120" stroke="#667FDA" stroke-width="3.6" stroke-linecap="round"/>
  <rect x="696" y="109" width="34" height="22" rx="4" fill="#10172D" stroke="#667FDA" stroke-width="1"/>
  <text x="713" y="124" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="11.5" fill="#667FDA">LM</text>

  <!-- Curva LM' desplazada (expansiva hacia abajo) -->
  <line x1="445" y1="185" x2="690" y2="185" stroke="#667FDA" stroke-width="2.6" stroke-dasharray="6 4" opacity=".95"/>
  <rect x="696" y="174" width="40" height="22" rx="4" fill="#10172D" stroke="#667FDA" stroke-width="1"/>
  <text x="716" y="189" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="11.5" fill="#667FDA">LM&#8242;</text>

  <!-- Curva IS fija -->
  <path d="M 470 75 C 520 110, 580 155, 680 225" fill="none" stroke="#FF6F4A" stroke-width="3.6" stroke-linecap="round"/>
  <rect x="682" y="215" width="30" height="20" rx="3" fill="#10172D" stroke="#FF6F4A" stroke-width="0.9"/>
  <text x="697" y="229" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="11.5" fill="#FF6F4A">IS</text>

  <!-- Vector dinámico A -> A' sobre IS -->
  <path d="M 535 130 C 560 148, 585 165, 605 178" fill="none" stroke="#667FDA" stroke-width="2.2" stroke-dasharray="3 2"/>
  <path d="M 598 179 L 607 179 L 604 170" fill="none" stroke="#667FDA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Nodos panel derecho -->
  <circle cx="520" cy="120" r="9" fill="#10172D" stroke="#EFF2F9" stroke-width="2.4"/>
  <circle cx="520" cy="120" r="3.8" fill="#FF6F4A"/>
  <rect x="528" y="100" width="24" height="20" rx="3" fill="#10172D" stroke="#2A324A" stroke-width="0.8"/>
  <text x="540" y="114" text-anchor="middle" font-family="Inter" font-weight="700" font-size="11" fill="#EFF2F9">A</text>

  <circle cx="620" cy="185" r="9" fill="#10172D" stroke="#667FDA" stroke-width="2.4"/>
  <circle cx="620" cy="185" r="3.8" fill="#FF6F4A"/>
  <rect x="628" y="165" width="26" height="20" rx="3" fill="#10172D" stroke="#667FDA" stroke-width="0.8"/>
  <text x="641" y="179" text-anchor="middle" font-family="Inter" font-weight="700" font-size="11" fill="#EFF2F9">A&#8242;</text>

  <!-- Desglose de 3 pasos panel derecho -->
  <rect x="398" y="275" width="344" height="95" rx="6" fill="#1B223C" stroke="#2A324A" stroke-width="0.8"/>
  <text x="408" y="295" font-family="JetBrains Mono" font-size="10" font-weight="700" fill="#667FDA">1. PASO 1:</text>
  <text x="470" y="295" font-family="Inter" font-size="10" fill="#EFF2F9">LM se desplaza hacia abajo (&#8595;i*)</text>
  <text x="408" y="322" font-family="JetBrains Mono" font-size="10" font-weight="700" fill="#FF6F4A">2. PASO 2:</text>
  <text x="470" y="322" font-family="Inter" font-size="10" fill="#EFF2F9">A &#8594; A&#8242; a lo largo de IS (cr&#233;dito barato, &#8593;Y)</text>
  <text x="408" y="349" font-family="JetBrains Mono" font-size="10" font-weight="700" fill="#55C975">3. PASO 3:</text>
  <text x="470" y="349" font-family="Inter" font-size="10" fill="#EFF2F9">Mayor Y &#8658; C sube, I sube por mayor venta</text>
</svg>