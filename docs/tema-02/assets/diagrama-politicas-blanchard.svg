<svg viewBox="0 0 680 340" role="img" aria-labelledby="fig-pol-title fig-pol-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="fig-pol-title">El método de los 3 pasos de Blanchard: Choque fiscal vs Choque monetario</title>
  <desc id="fig-pol-desc">Comparativa en dos paneles. Panel izquierdo: Política fiscal contractiva donde la curva IS se desplaza a la izquierda y la economía se mueve a lo largo de la LM horizontal, reduciendo Y sin alterar la tasa de interés. Panel derecho: Política monetaria expansiva donde la curva LM baja a un nivel de tasa menor y la economía se mueve a lo largo de la curva IS, reduciendo la tasa de interés y aumentando el producto.</desc>

  <!-- Panel Izquierdo: Choque Fiscal -->
  <rect x="6" y="6" width="328" height="328" rx="10" fill="#10172D" stroke="#2A324A" stroke-width="1.2"/>
  <rect x="18" y="16" width="304" height="22" rx="5" fill="#1B223C"/>
  <text x="170" y="31" text-anchor="middle" font-family="Inter" font-weight="600" font-size="10.5" fill="#FFB188">CASO 1: POLÍTICA FISCAL (&#8593;T &#243; &#8595;G)</text>

  <!-- Retícula panel izquierdo -->
  <path d="M45 90H305M45 130H305M45 170H305" fill="none" stroke="#2A324A" stroke-width="1" stroke-dasharray="4 5" opacity=".25"/>
  <path d="M135 48V210M210 48V210" fill="none" stroke="#2A324A" stroke-width="1" stroke-dasharray="4 5" opacity=".2"/>

  <!-- Sombreado de desplazamiento fiscal -->
  <path d="M 75 65 C 105 95, 135 130, 200 190 L 275 190 C 210 130, 160 95, 115 65 Z" fill="#FF6F4A" fill-opacity="0.08"/>

  <!-- Proyecciones ortogonales panel izquierdo -->
  <line x1="45" y1="130" x2="210" y2="130" stroke="#667FDA" stroke-width="1.2" stroke-dasharray="3 3" opacity=".6"/>
  <line x1="135" y1="130" x2="135" y2="210" stroke="#FFB188" stroke-width="1.2" stroke-dasharray="3 3" opacity=".7"/>
  <line x1="210" y1="130" x2="210" y2="210" stroke="#A3AABE" stroke-width="1.2" stroke-dasharray="3 3" opacity=".6"/>

  <!-- Ejes panel izquierdo -->
  <line x1="45" y1="46" x2="45" y2="210" stroke="#A3AABE" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="45" y1="210" x2="310" y2="210" stroke="#A3AABE" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M41 52L45 44L49 52" fill="none" stroke="#A3AABE" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M302 206L310 210L302 214" fill="none" stroke="#A3AABE" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Títulos ejes izquierdo -->
  <rect x="22" y="42" width="20" height="16" rx="3" fill="#10172D"/>
  <text x="32" y="54" text-anchor="middle" font-family="Inter" font-weight="700" font-size="11" fill="#EFF2F9">i</text>
  <rect x="302" y="214" width="20" height="16" rx="3" fill="#10172D"/>
  <text x="312" y="226" text-anchor="middle" font-family="Inter" font-weight="700" font-size="11" fill="#EFF2F9">Y</text>

  <!-- Coordenadas en ejes panel izquierdo -->
  <rect x="14" y="122" width="28" height="16" rx="3" fill="#10172D"/>
  <text x="28" y="134" text-anchor="middle" font-family="JetBrains Mono" font-size="10" fill="#667FDA">i*</text>

  <rect x="122" y="214" width="26" height="16" rx="3" fill="#10172D"/>
  <text x="135" y="226" text-anchor="middle" font-family="JetBrains Mono" font-size="10" fill="#FFB188">Y&#8242;</text>

  <rect x="198" y="214" width="24" height="16" rx="3" fill="#10172D"/>
  <text x="210" y="226" text-anchor="middle" font-family="JetBrains Mono" font-size="10" fill="#A3AABE">Y</text>

  <!-- Curva LM (horizontal e inalterada) -->
  <line x1="52" y1="130" x2="275" y2="130" stroke="#667FDA" stroke-width="2.8" stroke-linecap="round"/>
  <rect x="280" y="121" width="30" height="18" rx="4" fill="#10172D" stroke="#667FDA" stroke-width="0.8"/>
  <text x="295" y="134" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="10" fill="#667FDA">LM</text>

  <!-- Curva IS' desplazada -->
  <path d="M 75 65 C 105 95, 135 130, 200 190" fill="none" stroke="#FFB188" stroke-width="2" stroke-dasharray="5 4" opacity=".9"/>
  <rect x="58" y="52" width="28" height="18" rx="3" fill="#10172D" stroke="#FFB188" stroke-width="0.8"/>
  <text x="72" y="65" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="9.5" fill="#FFB188">IS&#8242;</text>

  <!-- Curva IS original -->
  <path d="M 115 65 C 160 95, 210 130, 275 190" fill="none" stroke="#FF6F4A" stroke-width="2.8" stroke-linecap="round"/>
  <rect x="272" y="180" width="26" height="18" rx="3" fill="#10172D" stroke="#FF6F4A" stroke-width="0.8"/>
  <text x="285" y="193" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="10" fill="#FF6F4A">IS</text>

  <!-- Vector dinámico A -> A' sobre LM -->
  <line x1="195" y1="130" x2="150" y2="130" stroke="#FFB188" stroke-width="1.8" stroke-dasharray="3 2"/>
  <path d="M156 126L149 130L156 134" fill="none" stroke="#FFB188" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Nodos panel izquierdo -->
  <circle cx="210" cy="130" r="7.5" fill="#10172D" stroke="#EFF2F9" stroke-width="2.2"/>
  <circle cx="210" cy="130" r="3" fill="#FF6F4A"/>
  <rect x="216" y="112" width="20" height="17" rx="3" fill="#10172D" stroke="#2A324A" stroke-width="0.8"/>
  <text x="226" y="124" text-anchor="middle" font-family="Inter" font-weight="700" font-size="10" fill="#EFF2F9">A</text>

  <circle cx="135" cy="130" r="7.5" fill="#10172D" stroke="#FFB188" stroke-width="2.2"/>
  <circle cx="135" cy="130" r="3" fill="#FFB188"/>
  <rect x="105" y="112" width="22" height="17" rx="3" fill="#10172D" stroke="#FFB188" stroke-width="0.8"/>
  <text x="116" y="124" text-anchor="middle" font-family="Inter" font-weight="700" font-size="10" fill="#FFB188">A&#8242;</text>

  <!-- Desglose de 3 pasos panel izquierdo -->
  <rect x="16" y="240" width="308" height="84" rx="6" fill="#1B223C" stroke="#2A324A" stroke-width="0.8"/>
  <text x="26" y="256" font-family="JetBrains Mono" font-size="9" font-weight="600" fill="#FFB188">1. PASO 1:</text>
  <text x="80" y="256" font-family="Inter" font-size="9" fill="#EFF2F9">IS se desplaza a la izquierda (&#8595;Z)</text>
  <text x="26" y="278" font-family="JetBrains Mono" font-size="9" font-weight="600" fill="#667FDA">2. PASO 2:</text>
  <text x="80" y="278" font-family="Inter" font-size="9" fill="#EFF2F9">A &#8594; A&#8242; a lo largo de LM (i* fija, &#8595;Y)</text>
  <text x="26" y="300" font-family="JetBrains Mono" font-size="9" font-weight="600" fill="#55C975">3. PASO 3:</text>
  <text x="80" y="300" font-family="Inter" font-size="9" fill="#EFF2F9">Menor Y &#8658; C cae, I cae por menor venta</text>

  <!-- Panel Derecho: Choque Monetario -->
  <rect x="346" y="6" width="328" height="328" rx="10" fill="#10172D" stroke="#2A324A" stroke-width="1.2"/>
  <rect x="358" y="16" width="304" height="22" rx="5" fill="#1B223C"/>
  <text x="510" y="31" text-anchor="middle" font-family="Inter" font-weight="600" font-size="10.5" fill="#667FDA">CASO 2: POLÍTICA MONETARIA (&#8595;i*)</text>

  <!-- Retícula panel derecho -->
  <path d="M385 105H645M385 160H645" fill="none" stroke="#2A324A" stroke-width="1" stroke-dasharray="4 5" opacity=".25"/>
  <path d="M460 48V210M545 48V210" fill="none" stroke="#2A324A" stroke-width="1" stroke-dasharray="4 5" opacity=".2"/>

  <!-- Sombreado de desplazamiento monetario -->
  <rect x="385" y="105" width="230" height="55" fill="#667FDA" fill-opacity="0.06"/>

  <!-- Proyecciones ortogonales panel derecho -->
  <line x1="385" y1="105" x2="460" y2="105" stroke="#A3AABE" stroke-width="1.2" stroke-dasharray="3 3" opacity=".6"/>
  <line x1="385" y1="160" x2="545" y2="160" stroke="#667FDA" stroke-width="1.2" stroke-dasharray="3 3" opacity=".7"/>
  <line x1="460" y1="105" x2="460" y2="210" stroke="#A3AABE" stroke-width="1.2" stroke-dasharray="3 3" opacity=".6"/>
  <line x1="545" y1="160" x2="545" y2="210" stroke="#667FDA" stroke-width="1.2" stroke-dasharray="3 3" opacity=".7"/>

  <!-- Ejes panel derecho -->
  <line x1="385" y1="46" x2="385" y2="210" stroke="#A3AABE" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="385" y1="210" x2="650" y2="210" stroke="#A3AABE" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M381 52L385 44L389 52" fill="none" stroke="#A3AABE" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M642 206L650 210L642 214" fill="none" stroke="#A3AABE" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Títulos ejes derecho -->
  <rect x="362" y="42" width="20" height="16" rx="3" fill="#10172D"/>
  <text x="372" y="54" text-anchor="middle" font-family="Inter" font-weight="700" font-size="11" fill="#EFF2F9">i</text>
  <rect x="642" y="214" width="20" height="16" rx="3" fill="#10172D"/>
  <text x="652" y="226" text-anchor="middle" font-family="Inter" font-weight="700" font-size="11" fill="#EFF2F9">Y</text>

  <!-- Coordenadas en ejes panel derecho -->
  <rect x="354" y="97" width="28" height="16" rx="3" fill="#10172D"/>
  <text x="368" y="109" text-anchor="middle" font-family="JetBrains Mono" font-size="10" fill="#A3AABE">i*</text>

  <rect x="352" y="152" width="30" height="16" rx="3" fill="#10172D"/>
  <text x="367" y="164" text-anchor="middle" font-family="JetBrains Mono" font-size="10" fill="#667FDA">i*&#8242;</text>

  <rect x="448" y="214" width="24" height="16" rx="3" fill="#10172D"/>
  <text x="460" y="226" text-anchor="middle" font-family="JetBrains Mono" font-size="10" fill="#A3AABE">Y</text>

  <rect x="532" y="214" width="26" height="16" rx="3" fill="#10172D"/>
  <text x="545" y="226" text-anchor="middle" font-family="JetBrains Mono" font-size="10" fill="#667FDA">Y&#8242;</text>

  <!-- Curva LM original -->
  <line x1="392" y1="105" x2="615" y2="105" stroke="#667FDA" stroke-width="2.8" stroke-linecap="round"/>
  <rect x="620" y="96" width="30" height="18" rx="4" fill="#10172D" stroke="#667FDA" stroke-width="0.8"/>
  <text x="635" y="109" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="10" fill="#667FDA">LM</text>

  <!-- Curva LM' desplazada (hacia abajo por baja de tasa) -->
  <line x1="392" y1="160" x2="615" y2="160" stroke="#667FDA" stroke-width="2" stroke-dasharray="5 4" opacity=".9"/>
  <rect x="620" y="151" width="34" height="18" rx="4" fill="#10172D" stroke="#667FDA" stroke-width="0.8"/>
  <text x="637" y="164" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="9.5" fill="#667FDA">LM&#8242;</text>

  <!-- Curva IS (inalterada) -->
  <path d="M 410 65 C 455 95, 505 130, 615 190" fill="none" stroke="#FF6F4A" stroke-width="2.8" stroke-linecap="round"/>
  <rect x="612" y="182" width="26" height="18" rx="3" fill="#10172D" stroke="#FF6F4A" stroke-width="0.8"/>
  <text x="625" y="195" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="10" fill="#FF6F4A">IS</text>

  <!-- Vector dinámico A -> A' a lo largo de IS -->
  <path d="M 475 118 C 495 132, 510 142, 532 152" fill="none" stroke="#667FDA" stroke-width="1.8" stroke-dasharray="3 2"/>
  <path d="M 527 155 L 535 153 L 531 147" fill="none" stroke="#667FDA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Nodos panel derecho -->
  <circle cx="460" cy="105" r="7.5" fill="#10172D" stroke="#EFF2F9" stroke-width="2.2"/>
  <circle cx="460" cy="105" r="3" fill="#FF6F4A"/>
  <rect x="440" y="86" width="20" height="17" rx="3" fill="#10172D" stroke="#2A324A" stroke-width="0.8"/>
  <text x="450" y="99" text-anchor="middle" font-family="Inter" font-weight="700" font-size="10" fill="#EFF2F9">A</text>

  <circle cx="545" cy="160" r="7.5" fill="#10172D" stroke="#667FDA" stroke-width="2.2"/>
  <circle cx="545" cy="160" r="3" fill="#667FDA"/>
  <rect x="555" y="148" width="22" height="17" rx="3" fill="#10172D" stroke="#667FDA" stroke-width="0.8"/>
  <text x="566" y="160" text-anchor="middle" font-family="Inter" font-weight="700" font-size="10" fill="#667FDA">A&#8242;</text>

  <!-- Desglose de 3 pasos panel derecho -->
  <rect x="356" y="240" width="308" height="84" rx="6" fill="#1B223C" stroke="#2A324A" stroke-width="0.8"/>
  <text x="366" y="256" font-family="JetBrains Mono" font-size="9" font-weight="600" fill="#667FDA">1. PASO 1:</text>
  <text x="420" y="256" font-family="Inter" font-size="9" fill="#EFF2F9">LM baja a LM&#8242; (Banco Central baja tasa)</text>
  <text x="366" y="278" font-family="JetBrains Mono" font-size="9" font-weight="600" fill="#FF6F4A">2. PASO 2:</text>
  <text x="420" y="278" font-family="Inter" font-size="9" fill="#EFF2F9">A &#8594; A&#8242; a lo largo de IS (&#8595;i*, &#8593;Y)</text>
  <text x="366" y="300" font-family="JetBrains Mono" font-size="9" font-weight="600" fill="#55C975">3. PASO 3:</text>
  <text x="420" y="300" font-family="Inter" font-size="9" fill="#EFF2F9">Menor tasa estimula I&#8593; &#8658; Y&#8593; &#8658; C&#8593;</text>
</svg>
