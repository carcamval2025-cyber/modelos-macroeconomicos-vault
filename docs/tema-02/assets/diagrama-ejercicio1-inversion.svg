<svg viewBox="0 0 780 400" role="img" aria-labelledby="fig-ej1-title fig-ej1-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="fig-ej1-title">Ejercicio 1 Resuelto: Impacto macroeconómico de una caída en la inversión autónoma</title>
  <desc id="fig-ej1-desc">Panel izquierdo con el modelo IS-LM mostrando el desplazamiento de la curva IS a la izquierda ante una caída en la inversión autónoma, llevando el equilibrio de A a A' sobre la LM horizontal. Panel derecho con el diagrama de flujo y la cadena de transmisión a las 10 variables macroeconómicas del modelo.</desc>

  <!-- Panel Izquierdo: Ajuste IS-LM -->
  <rect x="6" y="6" width="378" height="388" rx="12" fill="#10172D" stroke="#2A324A" stroke-width="1.2"/>
  <rect x="20" y="18" width="350" height="24" rx="5" fill="#1B223C"/>
  <text x="195" y="35" text-anchor="middle" font-family="Inter" font-weight="700" font-size="11.5" fill="#FFB188">AJUSTE IS-LM // CHOQUE: &#8595;I aut&#243;noma</text>

  <!-- Retícula cartesiana -->
  <path d="M55 105H355M55 160H355M55 215H355" fill="none" stroke="#2A324A" stroke-width="1" stroke-dasharray="4 5" opacity=".25"/>
  <path d="M150 55V260M250 55V260" fill="none" stroke="#2A324A" stroke-width="1" stroke-dasharray="4 5" opacity=".2"/>

  <!-- Sombreado de contracción -->
  <path d="M 75 75 C 110 110, 145 155, 230 225 L 320 225 C 245 155, 190 110, 135 75 Z" fill="#FF6F4A" fill-opacity="0.08"/>

  <!-- Proyecciones ortogonales -->
  <line x1="55" y1="160" x2="250" y2="160" stroke="#667FDA" stroke-width="1.4" stroke-dasharray="3 3" opacity=".6"/>
  <line x1="150" y1="160" x2="150" y2="260" stroke="#FFB188" stroke-width="1.4" stroke-dasharray="3 3" opacity=".75"/>
  <line x1="250" y1="160" x2="250" y2="260" stroke="#A3AABE" stroke-width="1.4" stroke-dasharray="3 3" opacity=".65"/>

  <!-- Ejes -->
  <line x1="55" y1="55" x2="55" y2="260" stroke="#A3AABE" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="55" y1="260" x2="360" y2="260" stroke="#A3AABE" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M50 63L55 53L60 63" fill="none" stroke="#A3AABE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M352 255L360 260L352 265" fill="none" stroke="#A3AABE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Títulos y valores ejes -->
  <rect x="30" y="50" width="22" height="18" rx="3" fill="#10172D"/>
  <text x="41" y="63" text-anchor="middle" font-family="Inter" font-weight="700" font-size="12" fill="#EFF2F9">i</text>
  <rect x="352" y="265" width="22" height="18" rx="3" fill="#10172D"/>
  <text x="363" y="278" text-anchor="middle" font-family="Inter" font-weight="700" font-size="12" fill="#EFF2F9">Y</text>

  <rect x="18" y="151" width="34" height="18" rx="3" fill="#10172D"/>
  <text x="35" y="164" text-anchor="middle" font-family="JetBrains Mono" font-size="11" fill="#667FDA">i*</text>

  <rect x="135" y="265" width="32" height="18" rx="3" fill="#10172D"/>
  <text x="151" y="278" text-anchor="middle" font-family="JetBrains Mono" font-size="11" fill="#FFB188">Y&#8242;</text>

  <rect x="236" y="265" width="28" height="18" rx="3" fill="#10172D"/>
  <text x="250" y="278" text-anchor="middle" font-family="JetBrains Mono" font-size="11" fill="#A3AABE">Y</text>

  <!-- Curva LM -->
  <line x1="65" y1="160" x2="320" y2="160" stroke="#667FDA" stroke-width="3.6" stroke-linecap="round"/>
  <rect x="325" y="149" width="34" height="22" rx="4" fill="#10172D" stroke="#667FDA" stroke-width="1"/>
  <text x="342" y="164" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="11.5" fill="#667FDA">LM</text>

  <!-- Curvas IS e IS' -->
  <path d="M 75 75 C 110 110, 145 155, 230 225" fill="none" stroke="#FFB188" stroke-width="2.4" stroke-dasharray="5 4" opacity=".95"/>
  <rect x="60" y="60" width="32" height="20" rx="3" fill="#10172D" stroke="#FFB188" stroke-width="0.9"/>
  <text x="76" y="74" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="11" fill="#FFB188">IS&#8242;</text>

  <path d="M 135 75 C 190 110, 245 155, 320 225" fill="none" stroke="#FF6F4A" stroke-width="3.6" stroke-linecap="round"/>
  <rect x="315" y="215" width="30" height="20" rx="3" fill="#10172D" stroke="#FF6F4A" stroke-width="0.9"/>
  <text x="330" y="229" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="11.5" fill="#FF6F4A">IS</text>

  <!-- Vector A -> A' -->
  <line x1="235" y1="160" x2="170" y2="160" stroke="#FFB188" stroke-width="2.2" stroke-dasharray="3 2"/>
  <path d="M178 155L169 160L178 165" fill="none" stroke="#FFB188" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Nodos -->
  <circle cx="250" cy="160" r="9" fill="#10172D" stroke="#EFF2F9" stroke-width="2.4"/>
  <circle cx="250" cy="160" r="3.8" fill="#FF6F4A"/>
  <rect x="258" y="140" width="24" height="20" rx="3" fill="#10172D" stroke="#2A324A" stroke-width="0.8"/>
  <text x="270" y="154" text-anchor="middle" font-family="Inter" font-weight="700" font-size="11" fill="#EFF2F9">A</text>

  <circle cx="150" cy="160" r="9" fill="#10172D" stroke="#FFB188" stroke-width="2.4"/>
  <circle cx="150" cy="160" r="3.8" fill="#FFB188"/>
  <rect x="116" y="140" width="26" height="20" rx="3" fill="#10172D" stroke="#FFB188" stroke-width="0.8"/>
  <text x="129" y="154" text-anchor="middle" font-family="Inter" font-weight="700" font-size="11" fill="#FFB188">A&#8242;</text>

  <!-- Pie del panel izquierdo -->
  <rect x="20" y="300" width="350" height="82" rx="6" fill="#1B223C" stroke="#2A324A" stroke-width="0.8"/>
  <text x="32" y="322" font-family="JetBrains Mono" font-size="10" font-weight="700" fill="#FFB188">&#916;I aut &lt; 0 &#8658; Contrae la demanda aut&#243;noma</text>
  <text x="32" y="344" font-family="Inter" font-size="10" fill="#EFF2F9">El equilibrio pasa de A a A&#8242; sobre la LM fija.</text>
  <text x="32" y="366" font-family="Inter" font-size="9.5" fill="#A3AABE">El producto cae (Y &#8594; Y&#8242;) manteniendo la tasa i* constante.</text>

  <!-- Panel Derecho: Cadena de Transmisión -->
  <rect x="396" y="6" width="378" height="388" rx="12" fill="#10172D" stroke="#2A324A" stroke-width="1.2"/>
  <rect x="410" y="18" width="350" height="24" rx="5" fill="#1B223C"/>
  <text x="585" y="35" text-anchor="middle" font-family="Inter" font-weight="700" font-size="11.5" fill="#667FDA">CADENA DE EFECTOS // 10 VARIABLES</text>

  <!-- Filas de variables 1 a 4 -->
  <rect x="410" y="52" width="168" height="40" rx="5" fill="#1B223C" stroke="#2A324A" stroke-width="0.8"/>
  <text x="422" y="69" font-family="JetBrains Mono" font-size="10.5" fill="#EFF2F9">Producto (Y)</text>
  <text x="422" y="84" font-family="Inter" font-weight="700" font-size="10.5" fill="#FB5668">[&#9660; DISMINUY&#211;]</text>

  <rect x="592" y="52" width="168" height="40" rx="5" fill="#1B223C" stroke="#2A324A" stroke-width="0.8"/>
  <text x="604" y="69" font-family="JetBrains Mono" font-size="10.5" fill="#EFF2F9">Consumo (C)</text>
  <text x="604" y="84" font-family="Inter" font-weight="700" font-size="10.5" fill="#FB5668">[&#9660; DISMINUY&#211;]</text>

  <rect x="410" y="100" width="168" height="40" rx="5" fill="#1B223C" stroke="#2A324A" stroke-width="0.8"/>
  <text x="422" y="117" font-family="JetBrains Mono" font-size="10.5" fill="#EFF2F9">Inversi&#243;n (I)</text>
  <text x="422" y="132" font-family="Inter" font-weight="700" font-size="10.5" fill="#FB5668">[&#9660; DISMINUY&#211;]</text>

  <rect x="592" y="100" width="168" height="40" rx="5" fill="#1B223C" stroke="#2A324A" stroke-width="0.8"/>
  <text x="604" y="117" font-family="JetBrains Mono" font-size="10.5" fill="#EFF2F9">Ahorro (S)</text>
  <text x="604" y="132" font-family="Inter" font-weight="700" font-size="10.5" fill="#FB5668">[&#9660; DISMINUY&#211;]</text>

  <rect x="410" y="148" width="168" height="40" rx="5" fill="#1B223C" stroke="#2A324A" stroke-width="0.8"/>
  <text x="422" y="165" font-family="JetBrains Mono" font-size="10.5" fill="#EFF2F9">Importac. (IM)</text>
  <text x="422" y="180" font-family="Inter" font-weight="700" font-size="10.5" fill="#FB5668">[&#9660; DISMINUY&#211;]</text>

  <rect x="592" y="148" width="168" height="40" rx="5" fill="#1B223C" stroke="#2A324A" stroke-width="0.8"/>
  <text x="604" y="165" font-family="JetBrains Mono" font-size="10.5" fill="#EFF2F9">Exportac. (X)</text>
  <text x="604" y="180" font-family="Inter" font-weight="700" font-size="10.5" fill="#A3AABE">[&#8213; NO CAMBI&#211;]</text>

  <rect x="410" y="196" width="168" height="40" rx="5" fill="#1B223C" stroke="#2A324A" stroke-width="0.8"/>
  <text x="422" y="213" font-family="JetBrains Mono" font-size="10.5" fill="#EFF2F9">Balanza (NX)</text>
  <text x="422" y="228" font-family="Inter" font-weight="700" font-size="10.5" fill="#55C975">[&#9650; MEJOR&#211;]</text>

  <rect x="592" y="196" width="168" height="40" rx="5" fill="#1B223C" stroke="#2A324A" stroke-width="0.8"/>
  <text x="604" y="213" font-family="JetBrains Mono" font-size="10.5" fill="#EFF2F9">Desempleo (u)</text>
  <text x="604" y="228" font-family="Inter" font-weight="700" font-size="10.5" fill="#FB5668">[&#9650; AUMENT&#211;]</text>

  <!-- Bloque inferior de dinero M^d y M^s -->
  <rect x="410" y="248" width="350" height="66" rx="5" fill="#1B223C" stroke="#667FDA" stroke-width="0.8"/>
  <text x="422" y="267" font-family="JetBrains Mono" font-size="10" font-weight="700" fill="#667FDA">Mercado Monetario:</text>
  <text x="422" y="286" font-family="Inter" font-size="10" fill="#EFF2F9">M<tspan baseline-shift="super" font-size="8">d</tspan>/P = Y&#183;L(i*) cae &#8658; El Banco Central reduce M<tspan baseline-shift="super" font-size="8">s</tspan>/P</text>
  <text x="422" y="304" font-family="JetBrains Mono" font-size="9" fill="#A3AABE">Oferta y Demanda de dinero caen en igual proporci&#243;n para mantener i*</text>

  <!-- Pie del panel derecho -->
  <rect x="410" y="324" width="350" height="58" rx="5" fill="#1B223C" stroke="#2A324A" stroke-width="0.8"/>
  <text x="422" y="344" font-family="Inter" font-size="10" fill="#EFF2F9">La balanza comercial mejora porque <tspan fill="#55C975" font-weight="700">NX = X &#8722; IM(Y)</tspan></text>
  <text x="422" y="364" font-family="Inter" font-size="9.5" fill="#A3AABE">Las exportaciones se mantienen y las importaciones caen al caer Y.</text>
</svg>