<svg viewBox="0 0 520 440" role="img" aria-labelledby="fig-deriv-title fig-deriv-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="fig-deriv-title">Derivación de la curva IS a partir del mercado de bienes</title>
  <desc id="fig-deriv-desc">Gráfico de dos paneles verticales alineados. Panel superior: Mercado de bienes con la recta de 45 grados Y=Z y dos curvas de demanda ZZ. Una tasa de interés más alta i' reduce la inversión y desplaza la demanda agregada hacia abajo de ZZ a ZZ', reduciendo la producción de equilibrio de Y a Y'. Panel inferior: Espacio (Y, i) donde se proyectan los equilibrios A y A' para trazar la curva IS con pendiente negativa.</desc>

  <!-- Panel Superior: Cruce Keynesiano Z = Y -->
  <rect x="6" y="6" width="508" height="206" rx="10" fill="#10172D" stroke="#2A324A" stroke-width="1.2"/>

  <!-- Cabecera Panel Superior -->
  <rect x="18" y="14" width="310" height="20" rx="4" fill="#1B223C"/>
  <text x="173" y="28" text-anchor="middle" font-family="Inter" font-weight="600" font-size="10" fill="#EFF2F9">1. MERCADO DE BIENES: DEMANDA Z Y EQUILIBRIO Y = Z</text>
  <rect x="336" y="14" width="166" height="20" rx="4" fill="#1B223C" stroke="#2A324A" stroke-width="0.8"/>
  <text x="419" y="28" text-anchor="middle" font-family="JetBrains Mono" font-weight="600" font-size="9.5" fill="#FFB188">Z = C(Y−T) + I(Y, i) + G</text>

  <!-- Retícula superior -->
  <path d="M65 83H475M65 138H475" fill="none" stroke="#2A324A" stroke-width="1" stroke-dasharray="4 5" opacity=".3"/>
  <path d="M190 38V195M310 38V195" fill="none" stroke="#2A324A" stroke-width="1" stroke-dasharray="4 5" opacity=".25"/>

  <!-- Ejes panel superior -->
  <line x1="65" y1="36" x2="65" y2="195" stroke="#A3AABE" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="65" y1="195" x2="480" y2="195" stroke="#A3AABE" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M61 42L65 34L69 42" fill="none" stroke="#A3AABE" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M472 191L480 195L472 199" fill="none" stroke="#A3AABE" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Títulos ejes superior -->
  <rect x="36" y="32" width="22" height="16" rx="3" fill="#10172D"/>
  <text x="47" y="44" text-anchor="middle" font-family="Inter" font-weight="700" font-size="11" fill="#EFF2F9">Z</text>
  <rect x="470" y="200" width="22" height="16" rx="3" fill="#10172D"/>
  <text x="481" y="212" text-anchor="middle" font-family="Inter" font-weight="700" font-size="11" fill="#EFF2F9">Y</text>

  <!-- Recta de 45 grados (Y = Z) -->
  <line x1="70" y1="192" x2="390" y2="46" stroke="#A3AABE" stroke-width="1.4" stroke-dasharray="5 4" opacity=".55"/>
  <rect x="350" y="38" width="82" height="18" rx="4" fill="#10172D" stroke="#A3AABE" stroke-width="0.8" opacity=".9"/>
  <text x="391" y="51" text-anchor="middle" font-family="JetBrains Mono" font-size="9" fill="#A3AABE">Y = Z (45&#176;)</text>

  <!-- Demanda ZZ' (tasa mayor i', reducida) -->
  <line x1="70" y1="168" x2="430" y2="78" stroke="#FFB188" stroke-width="2.2" stroke-dasharray="6 4" opacity=".9"/>
  <rect x="424" y="68" width="56" height="18" rx="4" fill="#10172D" stroke="#FFB188" stroke-width="0.8"/>
  <text x="452" y="81" text-anchor="middle" font-family="JetBrains Mono" font-weight="600" font-size="9.5" fill="#FFB188">ZZ&#8242; (i&#8242;)</text>

  <!-- Demanda ZZ (tasa base i, mayor) -->
  <line x1="70" y1="143" x2="430" y2="53" stroke="#FF6F4A" stroke-width="3" stroke-linecap="round"/>
  <rect x="424" y="44" width="56" height="18" rx="4" fill="#10172D" stroke="#FF6F4A" stroke-width="1"/>
  <text x="452" y="57" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="10" fill="#FF6F4A">ZZ (i)</text>

  <!-- Vector de desplazamiento de demanda ZZ a ZZ' -->
  <line x1="250" y1="98" x2="250" y2="120" stroke="#FFB188" stroke-width="1.5" stroke-dasharray="3 2"/>
  <path d="M246 114L250 121L254 114" fill="none" stroke="#FFB188" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="256" y="103" width="120" height="18" rx="4" fill="#10172D" stroke="#FFB188" stroke-width="0.8"/>
  <text x="316" y="115" text-anchor="middle" font-family="Inter" font-weight="600" font-size="8.5" fill="#FFB188">&#8595; Inversi&#243;n ante &#8593;i</text>

  <!-- Nodos panel superior -->
  <!-- Nodo A' (190, 138) -->
  <circle cx="190" cy="138" r="7.5" fill="#10172D" stroke="#667FDA" stroke-width="2.2"/>
  <circle cx="190" cy="138" r="3" fill="#FF6F4A"/>
  <rect x="168" y="118" width="22" height="17" rx="3" fill="#10172D" stroke="#667FDA" stroke-width="0.8"/>
  <text x="179" y="130" text-anchor="middle" font-family="Inter" font-weight="700" font-size="10" fill="#EFF2F9">A&#8242;</text>

  <!-- Nodo A (310, 83) -->
  <circle cx="310" cy="83" r="7.5" fill="#10172D" stroke="#EFF2F9" stroke-width="2.2"/>
  <circle cx="310" cy="83" r="3" fill="#FF6F4A"/>
  <rect x="316" y="66" width="20" height="17" rx="3" fill="#10172D" stroke="#2A324A" stroke-width="0.8"/>
  <text x="326" y="79" text-anchor="middle" font-family="Inter" font-weight="700" font-size="10" fill="#EFF2F9">A</text>

  <!-- Proyecciones verticales inter-panel (conectan superior con inferior) -->
  <line x1="190" y1="138" x2="190" y2="395" stroke="#667FDA" stroke-width="1.3" stroke-dasharray="3 3" opacity=".85"/>
  <line x1="310" y1="83" x2="310" y2="395" stroke="#A3AABE" stroke-width="1.3" stroke-dasharray="3 3" opacity=".7"/>

  <!-- Panel Inferior: Relación IS en el espacio (Y, i) -->
  <rect x="6" y="218" width="508" height="216" rx="10" fill="#10172D" stroke="#2A324A" stroke-width="1.2"/>

  <!-- Cabecera Panel Inferior -->
  <rect x="18" y="226" width="310" height="20" rx="4" fill="#1B223C"/>
  <text x="173" y="240" text-anchor="middle" font-family="Inter" font-weight="600" font-size="10" fill="#EFF2F9">2. RELACIÓN IS: PROYECCIÓN AL ESPACIO (Y, i)</text>
  <rect x="336" y="226" width="166" height="20" rx="4" fill="#1B223C" stroke="#2A324A" stroke-width="0.8"/>
  <text x="419" y="240" text-anchor="middle" font-family="JetBrains Mono" font-weight="600" font-size="9.5" fill="#667FDA">&#8593;i &#8658; &#8595;I &#8658; &#8595;Y de equilibrio</text>

  <!-- Retícula inferior -->
  <path d="M65 275H475M65 345H475" fill="none" stroke="#2A324A" stroke-width="1" stroke-dasharray="4 5" opacity=".3"/>

  <!-- Proyecciones horizontales a eje i -->
  <line x1="65" y1="275" x2="190" y2="275" stroke="#667FDA" stroke-width="1.2" stroke-dasharray="3 3" opacity=".8"/>
  <line x1="65" y1="345" x2="310" y2="345" stroke="#A3AABE" stroke-width="1.2" stroke-dasharray="3 3" opacity=".7"/>

  <!-- Ejes panel inferior -->
  <line x1="65" y1="248" x2="65" y2="395" stroke="#A3AABE" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="65" y1="395" x2="480" y2="395" stroke="#A3AABE" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M61 254L65 246L69 254" fill="none" stroke="#A3AABE" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M472 391L480 395L472 399" fill="none" stroke="#A3AABE" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Títulos ejes inferior -->
  <rect x="36" y="244" width="22" height="16" rx="3" fill="#10172D"/>
  <text x="47" y="256" text-anchor="middle" font-family="Inter" font-weight="700" font-size="11" fill="#EFF2F9">i</text>
  <rect x="470" y="400" width="22" height="16" rx="3" fill="#10172D"/>
  <text x="481" y="412" text-anchor="middle" font-family="Inter" font-weight="700" font-size="11" fill="#EFF2F9">Y</text>

  <!-- Marcas y valores en los ejes del panel inferior -->
  <line x1="60" y1="275" x2="65" y2="275" stroke="#667FDA" stroke-width="1.5"/>
  <line x1="60" y1="345" x2="65" y2="345" stroke="#A3AABE" stroke-width="1.5"/>
  <rect x="28" y="267" width="30" height="17" rx="3" fill="#10172D"/>
  <text x="43" y="280" text-anchor="middle" font-family="JetBrains Mono" font-size="10.5" fill="#667FDA">i&#8242;</text>

  <rect x="30" y="337" width="28" height="17" rx="3" fill="#10172D"/>
  <text x="44" y="350" text-anchor="middle" font-family="JetBrains Mono" font-size="10.5" fill="#A3AABE">i</text>

  <line x1="190" y1="395" x2="190" y2="400" stroke="#667FDA" stroke-width="1.5"/>
  <line x1="310" y1="395" x2="310" y2="400" stroke="#A3AABE" stroke-width="1.5"/>
  <rect x="175" y="402" width="30" height="17" rx="3" fill="#10172D"/>
  <text x="190" y="415" text-anchor="middle" font-family="JetBrains Mono" font-size="10.5" fill="#667FDA">Y&#8242;</text>

  <rect x="295" y="402" width="30" height="17" rx="3" fill="#10172D"/>
  <text x="310" y="415" text-anchor="middle" font-family="JetBrains Mono" font-size="10.5" fill="#A3AABE">Y</text>

  <!-- Curva IS proyectada que pasa EXACTAMENTE por (190, 275) y (310, 345) -->
  <path d="M 125 240 C 170 263, 235 305, 410 385" fill="none" stroke="#FF6F4A" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M 125 240 C 170 263, 235 305, 410 385" fill="none" stroke="#FFB188" stroke-width="1.2" stroke-dasharray="4 4" opacity=".4"/>
  <rect x="414" y="375" width="34" height="20" rx="4" fill="#10172D" stroke="#FF6F4A" stroke-width="1"/>
  <text x="431" y="389" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="11.5" fill="#FF6F4A">IS</text>

  <!-- Nodos panel inferior -->
  <!-- Nodo A' (190, 275) -->
  <circle cx="190" cy="275" r="8.5" fill="#10172D" stroke="#667FDA" stroke-width="2.4"/>
  <circle cx="190" cy="275" r="3.5" fill="#FF6F4A"/>
  <rect x="202" y="265" width="68" height="20" rx="4" fill="#10172D" stroke="#667FDA" stroke-width="0.8"/>
  <text x="236" y="279" text-anchor="middle" font-family="Inter" font-weight="700" font-size="10" fill="#EFF2F9">A&#8242; (i&#8242;, Y&#8242;)</text>

  <!-- Nodo A (310, 345) -->
  <circle cx="310" cy="345" r="8.5" fill="#10172D" stroke="#EFF2F9" stroke-width="2.4"/>
  <circle cx="310" cy="345" r="3.5" fill="#FF6F4A"/>
  <rect x="322" y="335" width="62" height="20" rx="4" fill="#10172D" stroke="#2A324A" stroke-width="0.8"/>
  <text x="353" y="349" text-anchor="middle" font-family="Inter" font-weight="700" font-size="10" fill="#EFF2F9">A (i, Y)</text>

  <!-- Resumen al pie del diagrama -->
  <rect x="18" y="419" width="484" height="16" rx="4" fill="#1B223C" opacity=".6"/>
  <text x="260" y="431" text-anchor="middle" font-family="Inter" font-size="8.5" fill="#A3AABE">El equilibrio en el mercado de bienes proyecta unívocamente la pendiente negativa de la curva <tspan fill="#FF6F4A" font-weight="600">IS</tspan></text>
</svg>
