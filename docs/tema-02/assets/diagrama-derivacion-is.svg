<svg viewBox="0 0 580 540" role="img" aria-labelledby="fig-deriv-title fig-deriv-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="fig-deriv-title">Derivación de la curva IS a partir del mercado de bienes</title>
  <desc id="fig-deriv-desc">Diagrama canónico de dos paneles. Panel superior: Mercado de bienes donde una subida de tasa reduce la inversión y desplaza la demanda ZZ hacia abajo a ZZ', reduciendo el producto de equilibrio de Y a Y'. Panel inferior: Proyección vertical directa de los equilibrios A y A' para trazar la curva IS con pendiente negativa.</desc>

  <!-- Marco exterior -->
  <rect x="6" y="6" width="568" height="528" rx="10" fill="#10172D" stroke="#2A324A" stroke-width="1.2"/>

  <!-- ======================================================== -->
  <!-- PANEL SUPERIOR: MERCADO DE BIENES (Z = Y)               -->
  <!-- ======================================================== -->
  <rect x="18" y="16" width="260" height="22" rx="4" fill="#1B223C"/>
  <text x="148" y="31" text-anchor="middle" font-family="Inter" font-weight="700" font-size="10" fill="#EFF2F9">1. MERCADO DE BIENES (CRUCE KEYNESIANO)</text>

  <rect x="290" y="16" width="272" height="22" rx="4" fill="#1B223C" stroke="#2A324A" stroke-width="0.8"/>
  <text x="426" y="31" text-anchor="middle" font-family="JetBrains Mono" font-weight="600" font-size="10" fill="#FFB188">Condici&#243;n de equilibrio: Y = Z</text>

  <!-- Retícula tenue panel superior -->
  <path d="M65 66H510M65 154H510" fill="none" stroke="#2A324A" stroke-width="1" stroke-dasharray="4 5" opacity=".2"/>
  <path d="M220 48V235M390 48V235" fill="none" stroke="#2A324A" stroke-width="1" stroke-dasharray="4 5" opacity=".18"/>

  <!-- Ejes panel superior -->
  <line x1="65" y1="48" x2="65" y2="235" stroke="#A3AABE" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="65" y1="235" x2="520" y2="235" stroke="#A3AABE" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M61 54L65 46L69 54" fill="none" stroke="#A3AABE" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M512 231L520 235L512 239" fill="none" stroke="#A3AABE" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Títulos ejes superior -->
  <rect x="36" y="46" width="24" height="18" rx="3" fill="#10172D"/>
  <text x="48" y="59" text-anchor="middle" font-family="Inter" font-weight="700" font-size="11" fill="#EFF2F9">Z</text>
  <rect x="512" y="240" width="24" height="18" rx="3" fill="#10172D"/>
  <text x="524" y="253" text-anchor="middle" font-family="Inter" font-weight="700" font-size="11" fill="#EFF2F9">Y</text>

  <!-- Recta de 45 grados (Y = Z) -->
  <line x1="65" y1="235" x2="430" y2="45" stroke="#A3AABE" stroke-width="1.5" stroke-dasharray="6 4" opacity=".6"/>
  <rect x="350" y="38" width="92" height="18" rx="3" fill="#10172D" stroke="#A3AABE" stroke-width="0.8"/>
  <text x="396" y="51" text-anchor="middle" font-family="JetBrains Mono" font-size="9" fill="#A3AABE">Y = Z (recta 45&#176;)</text>

  <!-- Demanda ZZ' (tasa i' alta) -->
  <line x1="65" y1="188" x2="490" y2="95" stroke="#FFB188" stroke-width="2.2" stroke-dasharray="6 4" opacity=".95"/>
  <rect x="445" y="94" width="75" height="18" rx="3" fill="#10172D" stroke="#FFB188" stroke-width="0.8"/>
  <text x="482" y="107" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="9.5" fill="#FFB188">ZZ&#8242; (tasa i&#8242;)</text>

  <!-- Demanda ZZ (tasa i baja) -->
  <line x1="65" y1="138" x2="490" y2="44" stroke="#FF6F4A" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="65" y1="138" x2="490" y2="44" stroke="#FFB188" stroke-width="1.2" stroke-dasharray="4 4" opacity=".4"/>
  <rect x="445" y="44" width="70" height="18" rx="3" fill="#10172D" stroke="#FF6F4A" stroke-width="0.8"/>
  <text x="480" y="57" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="10" fill="#FF6F4A">ZZ (tasa i)</text>

  <!-- Flecha pequeña y discreta de desplazamiento hacia abajo -->
  <line x1="305" y1="92" x2="305" y2="126" stroke="#FFB188" stroke-width="1.6"/>
  <path d="M301 120L305 127L309 120" fill="none" stroke="#FFB188" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="256" y="101" width="44" height="16" rx="3" fill="#10172D" stroke="#FFB188" stroke-width="0.8"/>
  <text x="278" y="113" text-anchor="middle" font-family="Inter" font-weight="600" font-size="8.5" fill="#FFB188">&#8595;I (&#8593;i)</text>

  <!-- Nodos panel superior -->
  <!-- Nodo A inicial -->
  <circle cx="390" cy="66" r="7.5" fill="#10172D" stroke="#EFF2F9" stroke-width="2.2"/>
  <circle cx="390" cy="66" r="3.2" fill="#FF6F4A"/>
  <rect x="402" y="56" width="22" height="18" rx="3" fill="#10172D" stroke="#2A324A" stroke-width="0.8"/>
  <text x="413" y="69" text-anchor="middle" font-family="Inter" font-weight="700" font-size="10" fill="#EFF2F9">A</text>

  <!-- Nodo A' nuevo -->
  <circle cx="220" cy="154" r="7.5" fill="#10172D" stroke="#667FDA" stroke-width="2.2"/>
  <circle cx="220" cy="154" r="3.2" fill="#FF6F4A"/>
  <rect x="190" y="144" width="24" height="18" rx="3" fill="#10172D" stroke="#667FDA" stroke-width="0.8"/>
  <text x="202" y="157" text-anchor="middle" font-family="Inter" font-weight="700" font-size="10" fill="#EFF2F9">A&#8242;</text>

  <!-- Coordenadas eje Y superior -->
  <rect x="206" y="240" width="28" height="16" rx="3" fill="#10172D"/>
  <text x="220" y="252" text-anchor="middle" font-family="JetBrains Mono" font-size="9.5" fill="#667FDA">Y&#8242;</text>

  <rect x="378" y="240" width="24" height="16" rx="3" fill="#10172D"/>
  <text x="390" y="252" text-anchor="middle" font-family="JetBrains Mono" font-size="9.5" fill="#A3AABE">Y</text>

  <!-- ======================================================== -->
  <!-- GUÍAS DIRECTAS DE PROYECCIÓN VERTICAL (INTER-PANEL)      -->
  <!-- ======================================================== -->
  <line x1="220" y1="154" x2="220" y2="360" stroke="#667FDA" stroke-width="1.3" stroke-dasharray="3 3" opacity=".75"/>
  <path d="M217 352L220 358L223 352" fill="none" stroke="#667FDA" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>

  <line x1="390" y1="66" x2="390" y2="440" stroke="#A3AABE" stroke-width="1.3" stroke-dasharray="3 3" opacity=".65"/>
  <path d="M387 432L390 438L393 432" fill="none" stroke="#A3AABE" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ======================================================== -->
  <!-- PANEL INFERIOR: RELACIÓN IS (Y, i)                       -->
  <!-- ======================================================== -->
  <rect x="18" y="266" width="260" height="22" rx="4" fill="#1B223C"/>
  <text x="148" y="281" text-anchor="middle" font-family="Inter" font-weight="700" font-size="10" fill="#EFF2F9">2. RELACIÓN IS (TASA Y PRODUCTO)</text>

  <rect x="290" y="266" width="272" height="22" rx="4" fill="#1B223C" stroke="#2A324A" stroke-width="0.8"/>
  <text x="426" y="281" text-anchor="middle" font-family="JetBrains Mono" font-weight="600" font-size="10" fill="#667FDA">Curva IS: Pendiente negativa</text>

  <!-- Retícula tenue panel inferior -->
  <path d="M65 360H510M65 440H510" fill="none" stroke="#2A324A" stroke-width="1" stroke-dasharray="4 5" opacity=".2"/>

  <!-- Proyecciones horizontales eje i -->
  <line x1="65" y1="360" x2="220" y2="360" stroke="#667FDA" stroke-width="1.2" stroke-dasharray="3 3" opacity=".75"/>
  <line x1="65" y1="440" x2="390" y2="440" stroke="#A3AABE" stroke-width="1.2" stroke-dasharray="3 3" opacity=".65"/>

  <!-- Ejes panel inferior -->
  <line x1="65" y1="298" x2="65" y2="475" stroke="#A3AABE" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="65" y1="475" x2="520" y2="475" stroke="#A3AABE" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M61 304L65 296L69 304" fill="none" stroke="#A3AABE" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M512 471L520 475L512 479" fill="none" stroke="#A3AABE" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Títulos ejes inferior -->
  <rect x="36" y="296" width="24" height="18" rx="3" fill="#10172D"/>
  <text x="48" y="309" text-anchor="middle" font-family="Inter" font-weight="700" font-size="11" fill="#EFF2F9">i</text>
  <rect x="512" y="480" width="24" height="18" rx="3" fill="#10172D"/>
  <text x="524" y="493" text-anchor="middle" font-family="Inter" font-weight="700" font-size="11" fill="#EFF2F9">Y</text>

  <!-- Marcas y valores eje i -->
  <rect x="22" y="352" width="38" height="16" rx="3" fill="#10172D"/>
  <text x="41" y="364" text-anchor="middle" font-family="JetBrains Mono" font-size="9" fill="#667FDA">i&#8242; (alta)</text>

  <rect x="22" y="432" width="38" height="16" rx="3" fill="#10172D"/>
  <text x="41" y="444" text-anchor="middle" font-family="JetBrains Mono" font-size="9" fill="#A3AABE">i (baja)</text>

  <!-- Marcas eje Y inferior -->
  <rect x="206" y="480" width="28" height="16" rx="3" fill="#10172D"/>
  <text x="220" y="492" text-anchor="middle" font-family="JetBrains Mono" font-size="9.5" fill="#667FDA">Y&#8242;</text>

  <rect x="378" y="480" width="24" height="16" rx="3" fill="#10172D"/>
  <text x="390" y="492" text-anchor="middle" font-family="JetBrains Mono" font-size="9.5" fill="#A3AABE">Y</text>

  <!-- Curva IS -->
  <path d="M 140 322 C 210 355, 310 410, 470 465" fill="none" stroke="#FF6F4A" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M 140 322 C 210 355, 310 410, 470 465" fill="none" stroke="#FFB188" stroke-width="1.2" stroke-dasharray="4 4" opacity=".4"/>
  <rect x="475" y="454" width="28" height="18" rx="3" fill="#10172D" stroke="#FF6F4A" stroke-width="0.8"/>
  <text x="489" y="467" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="10.5" fill="#FF6F4A">IS</text>

  <!-- Nodos panel inferior -->
  <!-- Nodo A' (tasa alta, menor producto) -->
  <circle cx="220" cy="360" r="7.5" fill="#10172D" stroke="#667FDA" stroke-width="2.2"/>
  <circle cx="220" cy="360" r="3.2" fill="#FF6F4A"/>
  <rect x="232" y="350" width="60" height="18" rx="3" fill="#10172D" stroke="#667FDA" stroke-width="0.8"/>
  <text x="262" y="363" text-anchor="middle" font-family="Inter" font-weight="700" font-size="9.5" fill="#EFF2F9">A&#8242; (Y&#8242;, i&#8242;)</text>

  <!-- Nodo A (tasa baja, mayor producto) -->
  <circle cx="390" cy="440" r="7.5" fill="#10172D" stroke="#EFF2F9" stroke-width="2.2"/>
  <circle cx="390" cy="440" r="3.2" fill="#FF6F4A"/>
  <rect x="402" y="430" width="56" height="18" rx="3" fill="#10172D" stroke="#2A324A" stroke-width="0.8"/>
  <text x="430" y="443" text-anchor="middle" font-family="Inter" font-weight="700" font-size="9.5" fill="#EFF2F9">A (Y, i)</text>

  <!-- ======================================================== -->
  <!-- ZÓCALO INFERIOR SOBRIO                                   -->
  <!-- ======================================================== -->
  <rect x="18" y="504" width="544" height="24" rx="4" fill="#1B223C" stroke="#2A324A" stroke-width="0.8"/>
  <text x="290" y="520" text-anchor="middle" font-family="Inter" font-size="9" fill="#A3AABE">Derivaci&#243;n: <tspan fill="#667FDA" font-weight="600">&#8593;i</tspan> reduce inversi&#243;n <tspan fill="#FFB188">&#8595;I</tspan> &#8594; la demanda cae <tspan fill="#FF6F4A">&#8595;ZZ</tspan> &#8594; el producto se contrae a <tspan fill="#EFF2F9" font-weight="600">Y&#8242;</tspan> &#183; define la curva <tspan fill="#FF6F4A" font-weight="700">IS</tspan></text>
</svg>