<svg viewBox="0 0 620 580" role="img" aria-labelledby="fig-deriv-title fig-deriv-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="fig-deriv-title">Derivación de la curva IS a partir del mercado de bienes</title>
  <desc id="fig-deriv-desc">Diagrama canónico de dos paneles. Panel superior: Mercado de bienes donde una subida de tasa reduce la inversión y desplaza la demanda ZZ hacia abajo a ZZ', reduciendo el producto de equilibrio de Y a Y'. Panel inferior: Proyección vertical directa de los equilibrios A y A' para trazar la curva IS con pendiente negativa.</desc>

  <!-- Marco exterior -->
  <rect x="6" y="6" width="608" height="568" rx="12" fill="#10172D" stroke="#2A324A" stroke-width="1.2"/>

  <!-- ======================================================== -->
  <!-- PANEL SUPERIOR: MERCADO DE BIENES (Z = Y)               -->
  <!-- ======================================================== -->
  <rect x="20" y="18" width="280" height="24" rx="5" fill="#1B223C"/>
  <text x="160" y="35" text-anchor="middle" font-family="Inter" font-weight="700" font-size="11" fill="#EFF2F9">1. MERCADO DE BIENES (CRUCE KEYNESIANO)</text>

  <rect x="312" y="18" width="288" height="24" rx="5" fill="#1B223C" stroke="#2A324A" stroke-width="0.8"/>
  <text x="456" y="35" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="11" fill="#FFB188">Condici&#243;n de equilibrio: Y = Z</text>

  <!-- Retícula tenue panel superior -->
  <path d="M70 70H550M70 166H550" fill="none" stroke="#2A324A" stroke-width="1" stroke-dasharray="4 5" opacity=".2"/>
  <path d="M235 50V250M420 50V250" fill="none" stroke="#2A324A" stroke-width="1" stroke-dasharray="4 5" opacity=".18"/>

  <!-- Ejes panel superior -->
  <line x1="70" y1="50" x2="70" y2="250" stroke="#A3AABE" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="70" y1="250" x2="560" y2="250" stroke="#A3AABE" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M65 58L70 48L75 58" fill="none" stroke="#A3AABE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M552 245L560 250L552 255" fill="none" stroke="#A3AABE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Títulos ejes superior -->
  <rect x="38" y="46" width="28" height="22" rx="4" fill="#10172D"/>
  <text x="52" y="62" text-anchor="middle" font-family="Inter" font-weight="700" font-size="13" fill="#EFF2F9">Z</text>
  <rect x="552" y="255" width="28" height="22" rx="4" fill="#10172D"/>
  <text x="566" y="271" text-anchor="middle" font-family="Inter" font-weight="700" font-size="13" fill="#EFF2F9">Y</text>

  <!-- Recta de 45 grados (Y = Z) -->
  <line x1="70" y1="250" x2="465" y2="48" stroke="#A3AABE" stroke-width="1.8" stroke-dasharray="6 4" opacity=".65"/>
  <rect x="380" y="40" width="108" height="20" rx="4" fill="#10172D" stroke="#A3AABE" stroke-width="0.8"/>
  <text x="434" y="54" text-anchor="middle" font-family="JetBrains Mono" font-size="10.5" fill="#A3AABE">Y = Z (recta 45&#176;)</text>

  <!-- Demanda ZZ' (tasa i' alta) -->
  <line x1="70" y1="200" x2="530" y2="102" stroke="#FFB188" stroke-width="2.6" stroke-dasharray="6 4" opacity=".95"/>
  <rect x="475" y="102" width="90" height="22" rx="4" fill="#10172D" stroke="#FFB188" stroke-width="0.9"/>
  <text x="520" y="117" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="11" fill="#FFB188">ZZ&#8242; (tasa i&#8242;)</text>

  <!-- Demanda ZZ (tasa i baja) -->
  <line x1="70" y1="148" x2="530" y2="48" stroke="#FF6F4A" stroke-width="3.8" stroke-linecap="round"/>
  <line x1="70" y1="148" x2="530" y2="48" stroke="#FFB188" stroke-width="1.3" stroke-dasharray="4 4" opacity=".4"/>
  <rect x="475" y="48" width="85" height="22" rx="4" fill="#10172D" stroke="#FF6F4A" stroke-width="1"/>
  <text x="517" y="63" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="11.5" fill="#FF6F4A">ZZ (tasa i)</text>

  <!-- Flecha pequeña y discreta de desplazamiento hacia abajo -->
  <line x1="330" y1="100" x2="330" y2="136" stroke="#FFB188" stroke-width="2"/>
  <path d="M325 128L330 137L335 128" fill="none" stroke="#FFB188" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="274" y="108" width="52" height="20" rx="4" fill="#10172D" stroke="#FFB188" stroke-width="0.8"/>
  <text x="300" y="122" text-anchor="middle" font-family="Inter" font-weight="600" font-size="9.5" fill="#FFB188">&#8595;I (&#8593;i)</text>

  <!-- Nodos panel superior -->
  <!-- Nodo A inicial -->
  <circle cx="420" cy="70" r="9" fill="#10172D" stroke="#EFF2F9" stroke-width="2.4"/>
  <circle cx="420" cy="70" r="3.8" fill="#FF6F4A"/>
  <rect x="434" y="58" width="28" height="22" rx="4" fill="#10172D" stroke="#2A324A" stroke-width="0.9"/>
  <text x="448" y="73" text-anchor="middle" font-family="Inter" font-weight="700" font-size="12" fill="#EFF2F9">A</text>

  <!-- Nodo A' nuevo -->
  <circle cx="235" cy="166" r="9" fill="#10172D" stroke="#667FDA" stroke-width="2.4"/>
  <circle cx="235" cy="166" r="3.8" fill="#FF6F4A"/>
  <rect x="200" y="154" width="30" height="22" rx="4" fill="#10172D" stroke="#667FDA" stroke-width="0.9"/>
  <text x="215" y="169" text-anchor="middle" font-family="Inter" font-weight="700" font-size="12" fill="#EFF2F9">A&#8242;</text>

  <!-- Coordenadas eje Y superior -->
  <rect x="218" y="255" width="34" height="20" rx="4" fill="#10172D"/>
  <text x="235" y="269" text-anchor="middle" font-family="JetBrains Mono" font-size="11.5" fill="#667FDA">Y&#8242;</text>

  <rect x="406" y="255" width="28" height="20" rx="4" fill="#10172D"/>
  <text x="420" y="269" text-anchor="middle" font-family="JetBrains Mono" font-size="11.5" fill="#A3AABE">Y</text>

  <!-- ======================================================== -->
  <!-- GUÍAS DIRECTAS DE PROYECCIÓN VERTICAL (INTER-PANEL)      -->
  <!-- ======================================================== -->
  <line x1="235" y1="166" x2="235" y2="385" stroke="#667FDA" stroke-width="1.5" stroke-dasharray="3 3" opacity=".8"/>
  <path d="M231 375L235 383L239 375" fill="none" stroke="#667FDA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <line x1="420" y1="70" x2="420" y2="475" stroke="#A3AABE" stroke-width="1.5" stroke-dasharray="3 3" opacity=".7"/>
  <path d="M416 465L420 473L424 465" fill="none" stroke="#A3AABE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ======================================================== -->
  <!-- PANEL INFERIOR: RELACIÓN IS (Y, i)                       -->
  <!-- ======================================================== -->
  <rect x="20" y="285" width="280" height="24" rx="5" fill="#1B223C"/>
  <text x="160" y="302" text-anchor="middle" font-family="Inter" font-weight="700" font-size="11" fill="#EFF2F9">2. RELACIÓN IS (TASA Y PRODUCTO)</text>

  <rect x="312" y="285" width="288" height="24" rx="5" fill="#1B223C" stroke="#2A324A" stroke-width="0.8"/>
  <text x="456" y="302" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="11" fill="#667FDA">Curva IS: Pendiente negativa (↑i ⇒ ↓Y)</text>

  <!-- Retícula tenue panel inferior -->
  <path d="M70 385H550M70 475H550" fill="none" stroke="#2A324A" stroke-width="1" stroke-dasharray="4 5" opacity=".2"/>

  <!-- Proyecciones horizontales eje i -->
  <line x1="70" y1="385" x2="235" y2="385" stroke="#667FDA" stroke-width="1.4" stroke-dasharray="3 3" opacity=".8"/>
  <line x1="70" y1="475" x2="420" y2="475" stroke="#A3AABE" stroke-width="1.4" stroke-dasharray="3 3" opacity=".7"/>

  <!-- Ejes panel inferior -->
  <line x1="70" y1="320" x2="70" y2="515" stroke="#A3AABE" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="70" y1="515" x2="560" y2="515" stroke="#A3AABE" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M65 328L70 318L75 328" fill="none" stroke="#A3AABE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M552 510L560 515L552 520" fill="none" stroke="#A3AABE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Títulos ejes inferior -->
  <rect x="38" y="316" width="28" height="22" rx="4" fill="#10172D"/>
  <text x="52" y="332" text-anchor="middle" font-family="Inter" font-weight="700" font-size="13" fill="#EFF2F9">i</text>
  <rect x="552" y="520" width="28" height="22" rx="4" fill="#10172D"/>
  <text x="566" y="536" text-anchor="middle" font-family="Inter" font-weight="700" font-size="13" fill="#EFF2F9">Y</text>

  <!-- Marcas y valores eje i -->
  <rect x="20" y="375" width="46" height="20" rx="4" fill="#10172D"/>
  <text x="43" y="390" text-anchor="middle" font-family="JetBrains Mono" font-size="11" fill="#667FDA">i&#8242; (alta)</text>

  <rect x="20" y="465" width="46" height="20" rx="4" fill="#10172D"/>
  <text x="43" y="480" text-anchor="middle" font-family="JetBrains Mono" font-size="11" fill="#A3AABE">i (baja)</text>

  <!-- Marcas eje Y inferior -->
  <rect x="218" y="520" width="34" height="20" rx="4" fill="#10172D"/>
  <text x="235" y="535" text-anchor="middle" font-family="JetBrains Mono" font-size="11.5" fill="#667FDA">Y&#8242;</text>

  <rect x="406" y="520" width="28" height="20" rx="4" fill="#10172D"/>
  <text x="420" y="535" text-anchor="middle" font-family="JetBrains Mono" font-size="11.5" fill="#A3AABE">Y</text>

  <!-- Curva IS -->
  <path d="M 145 345 C 225 382, 335 442, 510 505" fill="none" stroke="#FF6F4A" stroke-width="4.2" stroke-linecap="round"/>
  <path d="M 145 345 C 225 382, 335 442, 510 505" fill="none" stroke="#FFB188" stroke-width="1.4" stroke-dasharray="4 4" opacity=".4"/>
  <rect x="515" y="492" width="34" height="22" rx="4" fill="#10172D" stroke="#FF6F4A" stroke-width="1"/>
  <text x="532" y="507" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="12" fill="#FF6F4A">IS</text>

  <!-- Nodos panel inferior -->
  <!-- Nodo A' (tasa alta, menor producto) -->
  <circle cx="235" cy="385" r="9" fill="#10172D" stroke="#667FDA" stroke-width="2.4"/>
  <circle cx="235" cy="385" r="3.8" fill="#FF6F4A"/>
  <rect x="248" y="373" width="76" height="22" rx="4" fill="#10172D" stroke="#667FDA" stroke-width="0.9"/>
  <text x="286" y="388" text-anchor="middle" font-family="Inter" font-weight="700" font-size="11" fill="#EFF2F9">A&#8242; (Y&#8242;, i&#8242;)</text>

  <!-- Nodo A (tasa baja, mayor producto) -->
  <circle cx="420" cy="475" r="9" fill="#10172D" stroke="#EFF2F9" stroke-width="2.4"/>
  <circle cx="420" cy="475" r="3.8" fill="#FF6F4A"/>
  <rect x="434" y="463" width="70" height="22" rx="4" fill="#10172D" stroke="#2A324A" stroke-width="0.9"/>
  <text x="469" y="478" text-anchor="middle" font-family="Inter" font-weight="700" font-size="11" fill="#EFF2F9">A (Y, i)</text>

  <!-- ======================================================== -->
  <!-- ZÓCALO INFERIOR SOBRIO                                   -->
  <!-- ======================================================== -->
  <rect x="20" y="546" width="580" height="24" rx="4" fill="#1B223C" stroke="#2A324A" stroke-width="0.8"/>
  <text x="310" y="562" text-anchor="middle" font-family="Inter" font-size="10" fill="#A3AABE">Derivaci&#243;n: <tspan fill="#667FDA" font-weight="600">&#8593;i</tspan> reduce inversi&#243;n <tspan fill="#FFB188">&#8595;I</tspan> &#8594; la demanda cae <tspan fill="#FF6F4A">&#8595;ZZ</tspan> &#8594; el producto se contrae a <tspan fill="#EFF2F9" font-weight="600">Y&#8242;</tspan> &#183; define la curva <tspan fill="#FF6F4A" font-weight="700">IS</tspan></text>
</svg>