<svg viewBox="0 0 520 290" role="img" aria-labelledby="fig-eq-title fig-eq-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="fig-eq-title">Equilibrio conjunto IS-LM en el punto A</title>
  <desc id="fig-eq-desc">Eje vertical i, eje horizontal Y. La curva IS en coral con pendiente negativa y la curva LM horizontal en índigo se cortan en el punto A, determinando simultáneamente el producto de equilibrio Y* y la tasa de interés de política monetaria i*.</desc>

  <!-- Marco de contención y fondo técnico elevado -->
  <rect x="6" y="6" width="508" height="278" rx="10" fill="#10172D" stroke="#2A324A" stroke-width="1.2"/>

  <!-- Encabezado técnico -->
  <rect x="20" y="16" width="225" height="22" rx="5" fill="#1B223C"/>
  <text x="132" y="31" text-anchor="middle" font-family="Inter" font-weight="600" font-size="11" fill="#EFF2F9">Equilibrio Conjunto IS-LM</text>
  <rect x="255" y="16" width="245" height="22" rx="5" fill="#1B223C" stroke="#2A324A" stroke-width="1"/>
  <text x="377" y="31" text-anchor="middle" font-family="JetBrains Mono" font-weight="600" font-size="10.5" fill="#FFB188">Y* = C(Y*−T) + I(Y*, i*) + G</text>

  <!-- Retícula cartesiana discontinua técnica -->
  <path d="M65 90H475M65 145H475M65 200H475" fill="none" stroke="#2A324A" stroke-width="1" stroke-dasharray="4 5" opacity=".35"/>
  <path d="M140 50V235M210 50V235M280 50V235M350 50V235M420 50V235" fill="none" stroke="#2A324A" stroke-width="1" stroke-dasharray="4 5" opacity=".25"/>

  <!-- Proyecciones ortogonales al equilibrio A (280, 145) -->
  <line x1="65" y1="145" x2="280" y2="145" stroke="#667FDA" stroke-width="1.3" stroke-dasharray="3 3" opacity=".75"/>
  <line x1="280" y1="145" x2="280" y2="235" stroke="#FF6F4A" stroke-width="1.3" stroke-dasharray="3 3" opacity=".75"/>

  <!-- Ejes cartesianos con puntas de flecha sólidas -->
  <line x1="65" y1="46" x2="65" y2="235" stroke="#A3AABE" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="65" y1="235" x2="485" y2="235" stroke="#A3AABE" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M61 52L65 44L69 52" fill="none" stroke="#A3AABE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M477 231L485 235L477 239" fill="none" stroke="#A3AABE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Marcas de calibración (ticks) en los ejes -->
  <line x1="60" y1="145" x2="65" y2="145" stroke="#667FDA" stroke-width="1.5"/>
  <line x1="280" y1="235" x2="280" y2="240" stroke="#FF6F4A" stroke-width="1.5"/>

  <!-- Títulos de ejes protegidos con pastillas -->
  <rect x="34" y="42" width="24" height="18" rx="4" fill="#10172D"/>
  <text x="46" y="55" text-anchor="middle" font-family="Inter" font-weight="700" font-size="12" fill="#EFF2F9">i</text>
  <rect x="475" y="240" width="24" height="18" rx="4" fill="#10172D"/>
  <text x="487" y="253" text-anchor="middle" font-family="Inter" font-weight="700" font-size="12" fill="#EFF2F9">Y</text>

  <!-- Coordenadas del equilibrio A en los ejes protegidas por pastillas -->
  <rect x="24" y="137" width="36" height="17" rx="3" fill="#10172D"/>
  <text x="42" y="150" text-anchor="middle" font-family="JetBrains Mono" font-size="10.5" fill="#667FDA">i*</text>

  <rect x="264" y="242" width="32" height="17" rx="3" fill="#10172D"/>
  <text x="280" y="255" text-anchor="middle" font-family="JetBrains Mono" font-size="10.5" fill="#FF6F4A">Y*</text>

  <!-- Curva LM (horizontal en i*) -->
  <line x1="75" y1="145" x2="440" y2="145" stroke="#667FDA" stroke-width="3.4" stroke-linecap="round"/>
  <line x1="75" y1="145" x2="440" y2="145" stroke="#667FDA" stroke-width="1.2" stroke-dasharray="4 4" opacity=".4"/>
  <rect x="444" y="135" width="38" height="20" rx="4" fill="#10172D" stroke="#667FDA" stroke-width="1"/>
  <text x="463" y="149" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="11.5" fill="#667FDA">LM</text>

  <!-- Curva IS (pendiente negativa) pasando exactamente por (280, 145) -->
  <path d="M 140 55 C 210 95, 280 145, 430 215" fill="none" stroke="#FF6F4A" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M 140 55 C 210 95, 280 145, 430 215" fill="none" stroke="#FFB188" stroke-width="1.2" stroke-dasharray="4 4" opacity=".4"/>
  <rect x="434" y="206" width="34" height="20" rx="4" fill="#10172D" stroke="#FF6F4A" stroke-width="1"/>
  <text x="451" y="220" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="11.5" fill="#FF6F4A">IS</text>

  <!-- Zonas pedagógicas de desequilibrio de mercado -->
  <rect x="300" y="72" width="168" height="20" rx="4" fill="#1B223C" stroke="#2A324A" stroke-width="0.8" opacity=".85"/>
  <text x="384" y="86" text-anchor="middle" font-family="Inter" font-size="8.5" fill="#A3AABE">Y &gt; Z : Exceso de oferta de bienes</text>

  <rect x="80" y="176" width="176" height="20" rx="4" fill="#1B223C" stroke="#2A324A" stroke-width="0.8" opacity=".85"/>
  <text x="168" y="190" text-anchor="middle" font-family="Inter" font-size="8.5" fill="#A3AABE">Z &gt; Y : Exceso de demanda de bienes</text>

  <!-- Nodo A (Equilibrio Conjunto en (280, 145)) -->
  <circle cx="280" cy="145" r="9.5" fill="#10172D" stroke="#EFF2F9" stroke-width="2.5"/>
  <circle cx="280" cy="145" r="4" fill="#FF6F4A"/>
  <!-- Badge de nodo A -->
  <rect x="296" y="125" width="138" height="24" rx="5" fill="#10172D" stroke="#EFF2F9" stroke-width="1"/>
  <text x="365" y="141" text-anchor="middle" font-family="Inter" font-weight="700" font-size="10.5" fill="#EFF2F9">Nodo A // Equilibrio</text>

  <!-- Resumen pedagógico en franja inferior protegida -->
  <rect x="20" y="263" width="480" height="20" rx="4" fill="#1B223C" stroke="#2A324A" stroke-width="0.8"/>
  <text x="260" y="277" text-anchor="middle" font-family="Inter" font-size="9" fill="#A3AABE">En el punto <tspan fill="#EFF2F9" font-weight="600">A</tspan>, mercado de bienes y mercados financieros están en equilibrio simultáneo</text>
</svg>
