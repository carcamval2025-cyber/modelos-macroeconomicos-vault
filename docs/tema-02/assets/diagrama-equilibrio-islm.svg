<svg viewBox="0 0 680 370" role="img" aria-labelledby="fig-eq-title fig-eq-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="fig-eq-title">Equilibrio conjunto IS-LM en el punto A</title>
  <desc id="fig-eq-desc">Eje vertical i, eje horizontal Y. La curva IS en coral con pendiente negativa y la curva LM horizontal en índigo se cortan en el punto A, determinando simultáneamente el producto de equilibrio Y* y la tasa de interés de política monetaria i*.</desc>

  <!-- Marco de contención y fondo técnico elevado -->
  <rect x="6" y="6" width="668" height="358" rx="12" fill="#10172D" stroke="#2A324A" stroke-width="1.2"/>

  <!-- Encabezado técnico -->
  <rect x="24" y="18" width="280" height="26" rx="5" fill="#1B223C"/>
  <text x="164" y="35" text-anchor="middle" font-family="Inter" font-weight="700" font-size="12" fill="#EFF2F9">Equilibrio Conjunto IS-LM</text>
  <rect x="316" y="18" width="340" height="26" rx="5" fill="#1B223C" stroke="#2A324A" stroke-width="1"/>
  <text x="486" y="35" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="11.5" fill="#FFB188">Y* = C(Y*−T) + I(Y*, i*) + G</text>

  <!-- Retícula cartesiana discontinua técnica -->
  <path d="M75 110H615M75 185H615M75 255H615" fill="none" stroke="#2A324A" stroke-width="1" stroke-dasharray="4 5" opacity=".35"/>
  <path d="M180 60V300M280 60V300M360 60V300M480 60V300" fill="none" stroke="#2A324A" stroke-width="1" stroke-dasharray="4 5" opacity=".25"/>

  <!-- Proyecciones ortogonales al equilibrio A (360, 185) -->
  <line x1="75" y1="185" x2="360" y2="185" stroke="#667FDA" stroke-width="1.5" stroke-dasharray="4 4" opacity=".8"/>
  <line x1="360" y1="185" x2="360" y2="300" stroke="#FF6F4A" stroke-width="1.5" stroke-dasharray="4 4" opacity=".8"/>

  <!-- Ejes cartesianos con puntas de flecha sólidas -->
  <line x1="75" y1="55" x2="75" y2="300" stroke="#A3AABE" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="75" y1="300" x2="625" y2="300" stroke="#A3AABE" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M70 63L75 53L80 63" fill="none" stroke="#A3AABE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M615 295L625 300L615 305" fill="none" stroke="#A3AABE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Marcas de calibración (ticks) en los ejes -->
  <line x1="68" y1="185" x2="75" y2="185" stroke="#667FDA" stroke-width="1.8"/>
  <line x1="360" y1="300" x2="360" y2="307" stroke="#FF6F4A" stroke-width="1.8"/>

  <!-- Títulos de ejes protegidos con pastillas -->
  <rect x="42" y="50" width="28" height="22" rx="4" fill="#10172D"/>
  <text x="56" y="66" text-anchor="middle" font-family="Inter" font-weight="700" font-size="14" fill="#EFF2F9">i</text>
  <rect x="615" y="306" width="28" height="22" rx="4" fill="#10172D"/>
  <text x="629" y="322" text-anchor="middle" font-family="Inter" font-weight="700" font-size="14" fill="#EFF2F9">Y</text>

  <!-- Coordenadas del equilibrio A en los ejes protegidas por pastillas -->
  <rect x="24" y="175" width="46" height="20" rx="4" fill="#10172D"/>
  <text x="47" y="190" text-anchor="middle" font-family="JetBrains Mono" font-size="12" fill="#667FDA">i*</text>

  <rect x="342" y="308" width="38" height="20" rx="4" fill="#10172D"/>
  <text x="360" y="323" text-anchor="middle" font-family="JetBrains Mono" font-size="12" fill="#FF6F4A">Y*</text>

  <!-- Curva LM (horizontal en i*) -->
  <line x1="85" y1="185" x2="560" y2="185" stroke="#667FDA" stroke-width="4.2" stroke-linecap="round"/>
  <line x1="85" y1="185" x2="560" y2="185" stroke="#667FDA" stroke-width="1.4" stroke-dasharray="4 4" opacity=".4"/>
  <rect x="568" y="173" width="46" height="24" rx="4" fill="#10172D" stroke="#667FDA" stroke-width="1.2"/>
  <text x="591" y="190" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="13" fill="#667FDA">LM</text>

  <!-- Curva IS (pendiente negativa) pasando exactamente por (360, 185) -->
  <path d="M 180 70 C 270 120, 360 185, 550 275" fill="none" stroke="#FF6F4A" stroke-width="4.2" stroke-linecap="round"/>
  <path d="M 180 70 C 270 120, 360 185, 550 275" fill="none" stroke="#FFB188" stroke-width="1.4" stroke-dasharray="4 4" opacity=".4"/>
  <rect x="556" y="263" width="42" height="24" rx="4" fill="#10172D" stroke="#FF6F4A" stroke-width="1.2"/>
  <text x="577" y="280" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="13" fill="#FF6F4A">IS</text>

  <!-- Zonas pedagógicas de desequilibrio de mercado -->
  <rect x="390" y="90" width="210" height="24" rx="4" fill="#1B223C" stroke="#2A324A" stroke-width="0.8" opacity=".9"/>
  <text x="495" y="106" text-anchor="middle" font-family="Inter" font-size="10.5" fill="#A3AABE">Y &gt; Z : Exceso de oferta de bienes</text>

  <rect x="100" y="225" width="220" height="24" rx="4" fill="#1B223C" stroke="#2A324A" stroke-width="0.8" opacity=".9"/>
  <text x="210" y="241" text-anchor="middle" font-family="Inter" font-size="10.5" fill="#A3AABE">Z &gt; Y : Exceso de demanda de bienes</text>

  <!-- Nodo A (Equilibrio Conjunto en (360, 185)) -->
  <circle cx="360" cy="185" r="11.5" fill="#10172D" stroke="#EFF2F9" stroke-width="3"/>
  <circle cx="360" cy="185" r="4.8" fill="#FF6F4A"/>
  <!-- Badge de nodo A -->
  <rect x="380" y="160" width="168" height="28" rx="5" fill="#10172D" stroke="#EFF2F9" stroke-width="1.2"/>
  <text x="464" y="179" text-anchor="middle" font-family="Inter" font-weight="700" font-size="12" fill="#EFF2F9">Nodo A // Equilibrio</text>

  <!-- Resumen pedagógico en franja inferior protegida -->
  <rect x="24" y="334" width="632" height="24" rx="4" fill="#1B223C" stroke="#2A324A" stroke-width="0.8"/>
  <text x="340" y="350" text-anchor="middle" font-family="Inter" font-size="10.5" fill="#A3AABE">En el punto <tspan fill="#EFF2F9" font-weight="600">A</tspan>, mercado de bienes y mercados financieros est&#225;n en equilibrio simult&#225;neo</text>
</svg>