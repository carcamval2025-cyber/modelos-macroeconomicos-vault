<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" role="img" aria-label="Curvas macroeconómicas abstractas con puntos de equilibrio">
  <!-- Curvas de nivel / Fronteras geométricas de fondo -->
  <path d="M190 260A170 170 0 0 1 370 70" fill="none" stroke="#5C9DFF" stroke-width="1" opacity=".10"/>
  <path d="M225 265A140 140 0 0 1 385 95" fill="none" stroke="#FF9B7D" stroke-width="1" stroke-dasharray="4 4" opacity=".12"/>
  <path d="M260 270A110 110 0 0 1 395 125" fill="none" stroke="#5C9DFF" stroke-width="1" opacity=".08"/>

  <!-- Ejes coordenados y flechas -->
  <path d="M150 25V255M135 240H390" fill="none" stroke="#A9ABAE" stroke-width="1.5" stroke-linecap="round" opacity=".35"/>
  <path d="M146 32L150 24L154 32M382 236L390 240L382 244" fill="none" stroke="#A9ABAE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".35"/>

  <!-- Marcas de graduación en los ejes -->
  <path d="M147 80H153M147 135H153M147 190H153M205 237V243M265 237V243M325 237V243" fill="none" stroke="#A9ABAE" stroke-width="1.2" stroke-linecap="round" opacity=".3"/>

  <!-- Guías de retícula técnica -->
  <path d="M150 135H380M150 80H380M265 25V240M325 25V240" fill="none" stroke="#3A3C41" stroke-width="1" stroke-dasharray="3 4" opacity=".4"/>

  <!-- Proyecciones a los ejes desde los equilibrios -->
  <path d="M150 135H265" fill="none" stroke="#F2552C" stroke-width="1.2" stroke-dasharray="4 4" opacity=".4"/>
  <path d="M265 135V240" fill="none" stroke="#5C9DFF" stroke-width="1.2" stroke-dasharray="4 4" opacity=".4"/>
  <path d="M150 110H305" fill="none" stroke="#FF9B7D" stroke-width="1" stroke-dasharray="3 4" opacity=".3"/>
  <path d="M305 110V240" fill="none" stroke="#5C9DFF" stroke-width="1" stroke-dasharray="3 4" opacity=".3"/>

  <!-- Curva IS base (Mercado de bienes) -->
  <path d="M145 60C205 100 275 165 375 210" fill="none" stroke="#F2552C" stroke-width="4.5" stroke-linecap="round" opacity=".85"/>

  <!-- Curva IS desplazada IS' (Expansión fiscal) -->
  <path d="M185 42C245 82 315 147 395 188" fill="none" stroke="#FF9B7D" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 5" opacity=".55"/>

  <!-- Curva LM (Mercado monetario / financiero) -->
  <path d="M145 220C205 180 275 115 375 65" fill="none" stroke="#5C9DFF" stroke-width="4.5" stroke-linecap="round" opacity=".9"/>

  <!-- Trayectoria / Vector de transición entre equilibrios -->
  <path d="M265 135C278 126 292 118 305 110" fill="none" stroke="#FF9B7D" stroke-width="2" stroke-dasharray="2 3" opacity=".75"/>
  <path d="M288 122L293 117L286 116" fill="none" stroke="#FF9B7D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>

  <!-- Nodo de equilibrio inicial E_0 -->
  <circle cx="265" cy="135" r="10.5" fill="#1A1B1D" stroke="#F2F2F0" stroke-width="3" opacity=".98"/>
  <circle cx="265" cy="135" r="5" fill="#F2552C"/>
  <circle cx="265" cy="135" r="2" fill="#F2F2F0"/>

  <!-- Nodo de equilibrio desplazado E_1 -->
  <circle cx="305" cy="110" r="8" fill="#1A1B1D" stroke="#5C9DFF" stroke-width="2.4" opacity=".95"/>
  <circle cx="305" cy="110" r="3" fill="#FF9B7D" opacity=".95"/>

  <!-- Nodo de origen -->
  <circle cx="150" cy="240" r="2.5" fill="#A9ABAE" opacity=".6"/>
</svg>
