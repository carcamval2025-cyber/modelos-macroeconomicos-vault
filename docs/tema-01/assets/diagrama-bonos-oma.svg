<svg viewBox="0 0 520 260" role="img" aria-labelledby="fig-bonos-title fig-bonos-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="fig-bonos-title">Determinación del Precio del Bono y Operaciones de Mercado Abierto</title>
  <desc id="fig-bonos-desc">Panel izquierdo con la curva hiperbólica inversa entre el precio del bono PB y la tasa de interés i, donde los puntos A y B coinciden exactamente con las proyecciones ortogonales y la curva. Panel derecho con el flujo de transmisión de una operación de mercado abierto expansiva.</desc>

  <!-- Panel Izquierdo: Curva PB vs i -->
  <rect x="8" y="8" width="250" height="244" rx="10" fill="#10172D" stroke="#2A324A" stroke-width="1.2"/>
  <rect x="24" y="16" width="218" height="22" rx="5" fill="#1B223C"/>
  <text x="133" y="31" text-anchor="middle" font-family="Inter" font-weight="600" font-size="11" fill="#EFF2F9">Relación Inversa: Precio y Tasa</text>
  
  <!-- Retícula de referencia y proyecciones ortogonales -->
  <!-- Proyección Punto A (105, 90) -->
  <line x1="45" y1="90" x2="105" y2="90" stroke="#667FDA" stroke-width="1.2" stroke-dasharray="3 3" opacity=".8"/>
  <line x1="105" y1="90" x2="105" y2="200" stroke="#667FDA" stroke-width="1.2" stroke-dasharray="3 3" opacity=".8"/>

  <!-- Proyección Punto B (165, 145) -->
  <line x1="45" y1="145" x2="165" y2="145" stroke="#A3AABE" stroke-width="1.2" stroke-dasharray="3 3" opacity=".6"/>
  <line x1="165" y1="145" x2="165" y2="200" stroke="#A3AABE" stroke-width="1.2" stroke-dasharray="3 3" opacity=".6"/>

  <!-- Ejes panel izquierdo -->
  <line x1="45" y1="46" x2="45" y2="200" stroke="#A3AABE" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="45" y1="200" x2="235" y2="200" stroke="#A3AABE" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M42 52L45 46L48 52" fill="none" stroke="#A3AABE" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M229 197L235 200L229 203" fill="none" stroke="#A3AABE" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Marcas (ticks) en los ejes -->
  <line x1="41" y1="90" x2="45" y2="90" stroke="#667FDA" stroke-width="1.5"/>
  <line x1="41" y1="145" x2="45" y2="145" stroke="#A3AABE" stroke-width="1.5"/>
  <line x1="105" y1="200" x2="105" y2="204" stroke="#667FDA" stroke-width="1.5"/>
  <line x1="165" y1="200" x2="165" y2="204" stroke="#A3AABE" stroke-width="1.5"/>

  <!-- Títulos de ejes -->
  <rect x="14" y="42" width="26" height="18" rx="4" fill="#10172D"/>
  <text x="27" y="55" text-anchor="middle" font-family="Inter" font-weight="600" font-size="11" fill="#A3AABE">P<tspan baseline-shift="sub" font-size="8">B</tspan></text>

  <rect x="226" y="204" width="18" height="16" rx="4" fill="#10172D"/>
  <text x="235" y="216" text-anchor="middle" font-family="Inter" font-weight="600" font-size="11" fill="#A3AABE">i</text>

  <!-- Valores en los ejes -->
  <text x="38" y="93" text-anchor="end" font-family="JetBrains Mono" font-size="8.5" fill="#EFF2F9">95.2</text>
  <text x="38" y="148" text-anchor="end" font-family="JetBrains Mono" font-size="8.5" fill="#A3AABE">90.9</text>
  <text x="105" y="215" text-anchor="middle" font-family="JetBrains Mono" font-size="8.5" fill="#EFF2F9">5%</text>
  <text x="165" y="215" text-anchor="middle" font-family="JetBrains Mono" font-size="8.5" fill="#A3AABE">10%</text>

  <!-- Curva hiperbólica PB = 100 / (1 + i) que pasa EXACTAMENTE por (105, 90) y (165, 145) -->
  <path d="M 60 58 C 80 72, 92 80, 105 90 C 125 106, 145 125, 165 145 C 185 163, 205 172, 220 178" fill="none" stroke="#FF6F4A" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M 60 58 C 80 72, 92 80, 105 90 C 125 106, 145 125, 165 145 C 185 163, 205 172, 220 178" fill="none" stroke="#FFB188" stroke-width="1.2" stroke-dasharray="3 3" opacity=".4"/>

  <!-- Punto A (105, 90): Tasa baja i=5%, Precio alto PB=95.2 -->
  <circle cx="105" cy="90" r="7.5" fill="#10172D" stroke="#EFF2F9" stroke-width="2.2"/>
  <circle cx="105" cy="90" r="3.2" fill="#FF6F4A"/>
  <!-- Etiqueta Punto A -->
  <rect x="114" y="74" width="76" height="18" rx="4" fill="#10172D" stroke="#667FDA" stroke-width="0.8"/>
  <text x="152" y="87" text-anchor="middle" font-family="JetBrains Mono" font-weight="600" font-size="8.5" fill="#EFF2F9">A (5%, 95.2)</text>

  <!-- Punto B (165, 145): Tasa alta i=10%, Precio bajo PB=90.9 -->
  <circle cx="165" cy="145" r="7" fill="#10172D" stroke="#667FDA" stroke-width="2"/>
  <circle cx="165" cy="145" r="3" fill="#FFB188"/>
  <!-- Etiqueta Punto B -->
  <rect x="126" y="152" width="82" height="18" rx="4" fill="#10172D" stroke="#2A324A" stroke-width="0.8"/>
  <text x="167" y="165" text-anchor="middle" font-family="JetBrains Mono" font-size="8.5" fill="#A3AABE">B (10%, 90.9)</text>

  <!-- Vector dinámico OMA en la curva (de B hacia A: compra de bonos eleva PB y baja i) -->
  <path d="M 152 133 C 138 120, 128 110, 118 100" fill="none" stroke="#55C975" stroke-width="1.8" stroke-dasharray="2 3"/>
  <path d="M 116 106 L 117 99 L 123 102" fill="none" stroke="#55C975" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Fórmula base inferior -->
  <rect x="36" y="222" width="194" height="22" rx="5" fill="#1B223C" stroke="#2A324A" stroke-width="1"/>
  <text x="133" y="237" text-anchor="middle" font-family="JetBrains Mono" font-size="9.5" font-weight="600" fill="#FFB188">P<tspan baseline-shift="sub" font-size="7.5">B</tspan> = 100 / (1 + i)  &#8660;  i = (100 - P<tspan baseline-shift="sub" font-size="7.5">B</tspan>)/P<tspan baseline-shift="sub" font-size="7.5">B</tspan></text>

  <!-- Panel Derecho: Flujo de Operación de Mercado Abierto -->
  <rect x="266" y="8" width="246" height="244" rx="10" fill="#10172D" stroke="#2A324A" stroke-width="1.2"/>
  <rect x="280" y="16" width="218" height="22" rx="5" fill="#1B223C"/>
  <text x="389" y="31" text-anchor="middle" font-family="Inter" font-weight="600" font-size="11" fill="#EFF2F9">Mecánica OMA Expansiva</text>

  <!-- Paso 1 -->
  <rect x="280" y="46" width="218" height="34" rx="6" fill="#1B223C" stroke="#667FDA" stroke-width="1"/>
  <text x="292" y="61" font-family="JetBrains Mono" font-size="9" font-weight="600" fill="#667FDA">1. INYECCIÓN</text>
  <text x="292" y="73" font-family="Inter" font-size="9" fill="#EFF2F9">Banco Central compra bonos</text>

  <!-- Flecha 1 a 2 -->
  <path d="M389 80V90" fill="none" stroke="#FF6F4A" stroke-width="1.5"/>
  <path d="M386 87L389 92L392 87" fill="none" stroke="#FF6F4A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Paso 2 -->
  <rect x="280" y="94" width="218" height="34" rx="6" fill="#1B223C" stroke="#FFB188" stroke-width="1"/>
  <text x="292" y="109" font-family="JetBrains Mono" font-size="9" font-weight="600" fill="#FFB188">2. PRECIO SUBE</text>
  <text x="292" y="121" font-family="Inter" font-size="9" fill="#EFF2F9">Demanda de bonos &#8593; &#8658; P<tspan baseline-shift="sub" font-size="7">B</tspan> sube</text>

  <!-- Flecha 2 a 3 -->
  <path d="M389 128V138" fill="none" stroke="#FF6F4A" stroke-width="1.5"/>
  <path d="M386 135L389 140L392 135" fill="none" stroke="#FF6F4A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Paso 3 -->
  <rect x="280" y="142" width="218" height="34" rx="6" fill="#1B223C" stroke="#55C975" stroke-width="1"/>
  <text x="292" y="157" font-family="JetBrains Mono" font-size="9" font-weight="600" fill="#55C975">3. TASA CAE</text>
  <text x="292" y="169" font-family="Inter" font-size="9" fill="#EFF2F9">Rendimiento efectivo i baja</text>

  <!-- Badge resultado inferior -->
  <rect x="280" y="194" width="218" height="46" rx="6" fill="#080C1C" stroke="#2A324A" stroke-width="1"/>
  <text x="389" y="213" text-anchor="middle" font-family="JetBrains Mono" font-size="10" font-weight="600" fill="#55C975">&#916; H &gt; 0 &#8658; &#916; P<tspan baseline-shift="sub" font-size="8">B</tspan> &gt; 0 &#8658; &#916; i &lt; 0</text>
  <text x="389" y="228" text-anchor="middle" font-family="Inter" font-size="8.5" fill="#A3AABE">Operación de mercado abierto expansiva</text>
</svg>
