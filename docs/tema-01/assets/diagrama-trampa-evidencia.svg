<svg viewBox="0 0 540 270" role="img" aria-labelledby="fig-evid-title fig-evid-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="fig-evid-title">La Trampa de Liquidez en Acción: Tasa de Interés y Reservas Bancarias (2008–2016)</title>
  <desc id="fig-evid-desc">Gráfico comparativo empírico de EE. UU. entre 2008 y 2016 con pastillas protectoras de texto. La tasa de fondos federales cae al 0% y permanece en el límite cero. Las reservas bancarias explotan de 10 mil millones a 2,500 mil millones de dólares sin mover la tasa.</desc>

  <!-- Fondo General -->
  <rect x="8" y="8" width="524" height="254" rx="12" fill="#1A1B1D" stroke="#3A3C41" stroke-width="1.2"/>
  <rect x="120" y="16" width="300" height="22" rx="5" fill="#202124"/>
  <text x="270" y="31" text-anchor="middle" font-family="Archivo, sans-serif" font-weight="600" font-size="11.5" fill="#F2F2F0">Evidencia Empírica de EE. UU. (Crisis Financiera 2008–2016)</text>

  <!-- Panel Izquierdo: Tasa de Fondos Federales (ZLB) -->
  <rect x="22" y="44" width="240" height="204" rx="8" fill="#202124" stroke="#3A3C41" stroke-width="1"/>
  <text x="142" y="62" text-anchor="middle" font-family="Archivo, sans-serif" font-weight="600" font-size="10.5" fill="#5C9DFF">Tasa de Fondos Federales (i)</text>

  <!-- Ejes Tasa -->
  <line x1="50" y1="72" x2="50" y2="195" stroke="#A9ABAE" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="50" y1="195" x2="245" y2="195" stroke="#A9ABAE" stroke-width="1.2" stroke-linecap="round"/>
  
  <rect x="28" y="70" width="20" height="14" rx="3" fill="#1A1B1D"/>
  <text x="38" y="81" text-anchor="middle" font-family="Azeret Mono, monospace" font-size="8.5" fill="#A9ABAE">5%</text>

  <rect x="28" y="188" width="20" height="14" rx="3" fill="#1A1B1D"/>
  <text x="38" y="199" text-anchor="middle" font-family="Azeret Mono, monospace" font-size="8.5" fill="#A9ABAE">0%</text>

  <text x="50" y="210" font-family="Azeret Mono, monospace" font-size="8" fill="#A9ABAE">'07</text>
  <text x="100" y="210" font-family="Azeret Mono, monospace" font-size="8" fill="#A9ABAE">'08</text>
  <text x="170" y="210" font-family="Azeret Mono, monospace" font-size="8" fill="#A9ABAE">'12</text>
  <text x="230" y="210" font-family="Azeret Mono, monospace" font-size="8" fill="#A9ABAE">'16</text>

  <!-- Zona sombreada ZLB -->
  <rect x="100" y="185" width="145" height="10" fill="#5C9DFF" opacity=".2"/>
  <rect x="125" y="168" width="94" height="15" rx="3" fill="#1A1B1D" stroke="#5C9DFF" stroke-width="0.8"/>
  <text x="172" y="179" text-anchor="middle" font-family="Azeret Mono, monospace" font-size="8" fill="#5C9DFF">Límite Cero (ZLB)</text>

  <!-- Trayectoria de la tasa: cae de 5.25% en 2007 a 0% a fines de 2008 y se queda plana -->
  <path d="M 50 80 L 80 110 L 100 195 L 245 195" fill="none" stroke="#5C9DFF" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="100" cy="195" r="4" fill="#F2552C"/>
  
  <!-- Pastilla fines 2008 -->
  <rect x="94" y="142" width="86" height="16" rx="3" fill="#1A1B1D" stroke="#F2552C" stroke-width="0.8"/>
  <text x="137" y="153" text-anchor="middle" font-family="Azeret Mono, monospace" font-size="7.5" fill="#F2552C">fines 2008: i = 0</text>

  <!-- Panel Derecho: Reservas Bancarias (Explosión QE) -->
  <rect x="278" y="44" width="240" height="204" rx="8" fill="#202124" stroke="#3A3C41" stroke-width="1"/>
  <text x="398" y="62" text-anchor="middle" font-family="Archivo, sans-serif" font-weight="600" font-size="10.5" fill="#F2552C">Reservas Bancarias en la Fed ($B)</text>

  <!-- Ejes Reservas -->
  <line x1="305" y1="72" x2="305" y2="195" stroke="#A9ABAE" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="305" y1="195" x2="500" y2="195" stroke="#A9ABAE" stroke-width="1.2" stroke-linecap="round"/>

  <rect x="276" y="70" width="28" height="14" rx="3" fill="#1A1B1D"/>
  <text x="290" y="81" text-anchor="middle" font-family="Azeret Mono, monospace" font-size="8" fill="#A9ABAE">$2.5T</text>

  <rect x="276" y="188" width="28" height="14" rx="3" fill="#1A1B1D"/>
  <text x="290" y="199" text-anchor="middle" font-family="Azeret Mono, monospace" font-size="8" fill="#A9ABAE">$10B</text>

  <text x="305" y="210" font-family="Azeret Mono, monospace" font-size="8" fill="#A9ABAE">'07</text>
  <text x="350" y="210" font-family="Azeret Mono, monospace" font-size="8" fill="#A9ABAE">'08</text>
  <text x="420" y="210" font-family="Azeret Mono, monospace" font-size="8" fill="#A9ABAE">'12</text>
  <text x="480" y="210" font-family="Azeret Mono, monospace" font-size="8" fill="#A9ABAE">'16</text>

  <!-- Curva de Reservas -->
  <path d="M 305 194 L 350 193 C 360 160, 390 110, 480 78" fill="none" stroke="#F2552C" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 305 194 L 350 193 C 360 160, 390 110, 480 78 L 480 195 L 305 195 Z" fill="#F2552C" opacity=".10"/>

  <!-- Punto 2008 -->
  <circle cx="350" cy="193" r="3.5" fill="#FF9B7D"/>
  <rect x="330" y="166" width="70" height="15" rx="3" fill="#1A1B1D" stroke="#3A3C41" stroke-width="0.8"/>
  <text x="365" y="177" text-anchor="middle" font-family="Azeret Mono, monospace" font-size="7.5" fill="#FF9B7D">$10B (2008)</text>

  <!-- Punto 2015 -->
  <circle cx="480" cy="78" r="4.5" fill="#1A1B1D" stroke="#F2F2F0" stroke-width="2"/>
  <circle cx="480" cy="78" r="2" fill="#F2552C"/>
  <rect x="400" y="68" width="74" height="18" rx="4" fill="#1A1B1D" stroke="#F2F2F0" stroke-width="0.8"/>
  <text x="437" y="80" text-anchor="middle" font-family="Azeret Mono, monospace" font-weight="600" font-size="8" fill="#F2F2F0">$2,500B (2015)</text>

  <!-- Conclusión inferior -->
  <rect x="22" y="222" width="496" height="20" rx="4" fill="#101112" stroke="#3A3C41" stroke-width="1"/>
  <text x="270" y="236" text-anchor="middle" font-family="Azeret Mono, monospace" font-size="8.5" fill="#55C975">Conclusión: A tasa cero, la inyección masiva de H se acumula en reservas sin alterar la tasa i.</text>
</svg>
