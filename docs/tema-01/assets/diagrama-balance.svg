<svg viewBox="0 0 520 220" role="img" aria-labelledby="fig1-title fig1-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="fig1-title">Balance del banco y del banco central</title>
  <desc id="fig1-desc">Dos balances contables lado a lado: el del banco comercial, con reservas, préstamos y bonos como activos y depósitos a la vista como pasivo; y el del banco central, con bonos como activo y dinero del banco central (reservas + efectivo) como pasivo. Una línea conectora sin obstrucciones une las reservas del banco comercial con el dinero del banco central (H).</desc>

  <!-- Tarjeta 1: Banco Comercial -->
  <rect x="10" y="10" width="230" height="165" rx="12" fill="#10172D" stroke="#2A324A" stroke-width="1.5"/>
  <rect x="11" y="11" width="228" height="34" rx="11" fill="#1B223C" opacity=".6"/>
  <!-- Ícono banco comercial -->
  <g transform="translate(20, 19)">
    <path d="M2 8L10 2L18 8" fill="none" stroke="#667FDA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M3 8V15M7 8V15M13 8V15M17 8V15" fill="none" stroke="#667FDA" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M1 17H19" fill="none" stroke="#667FDA" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <text x="130" y="33" text-anchor="middle" font-family="Inter" font-weight="600" font-size="14" fill="#EFF2F9">Banco</text>
  <line x1="10" y1="45" x2="240" y2="45" stroke="#2A324A" stroke-width="1"/>
  <line x1="125" y1="45" x2="125" y2="175" stroke="#2A324A" stroke-width="1"/>

  <!-- Fondos de columnas Activo / Pasivo -->
  <rect x="16" y="66" width="102" height="98" rx="6" fill="#1B223C" opacity=".4"/>
  <rect x="131" y="66" width="102" height="98" rx="6" fill="#1B223C" opacity=".4"/>

  <!-- Encabezados columnas -->
  <text x="67" y="58" text-anchor="middle" font-family="Inter" font-weight="600" font-size="11" fill="#A3AABE">Activos</text>
  <text x="182" y="58" text-anchor="middle" font-family="Inter" font-weight="600" font-size="11" fill="#A3AABE">Pasivos</text>

  <!-- Fila 1 Activo: Reservas (destacada) -->
  <rect x="22" y="72" width="90" height="22" rx="5" fill="#FF6F4A" fill-opacity=".12" stroke="#FF6F4A" stroke-width="1" stroke-opacity=".6"/>
  <circle cx="32" cy="83" r="3" fill="#FF6F4A"/>
  <text x="42" y="86" font-family="JetBrains Mono" font-weight="500" font-size="11" fill="#EFF2F9">Reservas</text>
  
  <!-- Fila 2 Activo: Préstamos -->
  <circle cx="32" cy="109" r="2.5" fill="#667FDA" opacity=".7"/>
  <text x="42" y="112" font-family="JetBrains Mono" font-size="11" fill="#EFF2F9">Préstamos</text>

  <!-- Fila 3 Activo: Bonos -->
  <circle cx="32" cy="135" r="2.5" fill="#667FDA" opacity=".7"/>
  <text x="42" y="138" font-family="JetBrains Mono" font-size="11" fill="#EFF2F9">Bonos</text>

  <!-- Fila 1 Pasivo: Depósitos a la vista -->
  <circle cx="141" cy="83" r="2.5" fill="#FFB188"/>
  <text x="149" y="86" font-family="JetBrains Mono" font-size="11" fill="#EFF2F9">Depósitos a</text>
  <text x="149" y="100" font-family="JetBrains Mono" font-size="11" fill="#EFF2F9">la vista</text>

  <!-- Tarjeta 2: Banco Central -->
  <rect x="270" y="10" width="240" height="165" rx="12" fill="#10172D" stroke="#2A324A" stroke-width="1.5"/>
  <rect x="271" y="11" width="238" height="34" rx="11" fill="#1B223C" opacity=".6"/>
  <!-- Ícono banco central -->
  <g transform="translate(280, 19)">
    <path d="M2 8L10 2L18 8" fill="none" stroke="#FF6F4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M3 8V15M7 8V15M13 8V15M17 8V15" fill="none" stroke="#FF6F4A" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M1 17H19" fill="none" stroke="#FF6F4A" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <text x="400" y="33" text-anchor="middle" font-family="Inter" font-weight="600" font-size="14" fill="#EFF2F9">Banco Central</text>
  <line x1="270" y1="45" x2="510" y2="45" stroke="#2A324A" stroke-width="1"/>
  <line x1="390" y1="45" x2="390" y2="175" stroke="#2A324A" stroke-width="1"/>

  <!-- Fondos de columnas Activo / Pasivo -->
  <rect x="276" y="66" width="108" height="98" rx="6" fill="#1B223C" opacity=".4"/>
  <rect x="396" y="66" width="108" height="98" rx="6" fill="#1B223C" opacity=".4"/>

  <!-- Encabezados columnas -->
  <text x="330" y="58" text-anchor="middle" font-family="Inter" font-weight="600" font-size="11" fill="#A3AABE">Activos</text>
  <text x="450" y="58" text-anchor="middle" font-family="Inter" font-weight="600" font-size="11" fill="#A3AABE">Pasivos</text>

  <!-- Fila 1 Activo: Bonos -->
  <circle cx="286" cy="95" r="2.5" fill="#667FDA" opacity=".7"/>
  <text x="294" y="98" font-family="JetBrains Mono" font-size="11" fill="#EFF2F9">Bonos</text>

  <!-- Fila 1 Pasivo: Dinero del banco central H (destacada) -->
  <rect x="402" y="72" width="96" height="36" rx="5" fill="#FF6F4A" fill-opacity=".12" stroke="#FF6F4A" stroke-width="1" stroke-opacity=".6"/>
  <circle cx="412" cy="83" r="3" fill="#FF6F4A"/>
  <text x="422" y="84" font-family="JetBrains Mono" font-weight="500" font-size="10.5" fill="#EFF2F9">Dinero del</text>
  <text x="422" y="97" font-family="JetBrains Mono" font-weight="500" font-size="10.5" fill="#EFF2F9">banco central (H)</text>
  <text x="450" y="122" text-anchor="middle" font-family="JetBrains Mono" font-size="9.5" fill="#A3AABE">= Reservas + Efectivo</text>

  <!-- Línea conectora sin obstrucción: Canal exterior inferior -->
  <!-- Salida de Reservas -> baja por canal izquierdo despejado (x: 18) -> entra a badge inferior -->
  <path d="M 22 83 H 14 Q 8 83 8 91 V 185 Q 8 198 22 198 H 120" fill="none" stroke="#FF6F4A" stroke-width="1.5" stroke-dasharray="3 3" opacity=".75"/>
  
  <!-- Continuación desde badge inferior -> sube por canal derecho despejado (x: 512) -> entra a H -->
  <path d="M 400 198 H 498 Q 512 198 512 185 V 91 Q 512 83 504 83 H 498" fill="none" stroke="#FF6F4A" stroke-width="1.5" stroke-dasharray="3 3" opacity=".75"/>
  <!-- Flecha entrando a H -->
  <path d="M 504 80 L 498 83 L 504 86" fill="none" stroke="#FF6F4A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>

  <!-- Badge explicativo inferior central -->
  <rect x="120" y="187" width="280" height="22" rx="6" fill="#10172D" stroke="#2A324A" stroke-width="1.2"/>
  <circle cx="135" cy="198" r="3" fill="#FF6F4A"/>
  <text x="262" y="201.5" text-anchor="middle" font-family="JetBrains Mono" font-weight="500" font-size="9.5" fill="#FF6F4A">las reservas del banco son parte de H</text>
</svg>
