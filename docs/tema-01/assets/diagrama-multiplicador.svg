<svg viewBox="0 0 540 280" role="img" aria-labelledby="fig-mult-title fig-mult-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="fig-mult-title">Flujo del Multiplicador Monetario y Demanda de Dinero Central</title>
  <desc id="fig-mult-desc">Diagrama de árbol de decisiones financieras que desglosa la demanda agregada de dinero Md en efectivo c*Md y depósitos (1-c)*Md. Los depósitos generan demanda de reservas theta*(1-c)*Md. Ambas ramas convergen en la demanda de dinero central Hd = [c + theta(1-c)]Md, originando el multiplicador monetario.</desc>

  <!-- Contenedor Principal -->
  <rect x="8" y="8" width="524" height="264" rx="12" fill="#10172D" stroke="#2A324A" stroke-width="1.2"/>

  <!-- Nivel 1: Demanda Total de Dinero Md -->
  <rect x="24" y="24" width="160" height="52" rx="8" fill="#1B223C" stroke="#FF6F4A" stroke-width="1.4"/>
  <text x="104" y="44" text-anchor="middle" font-family="Inter" font-weight="600" font-size="11" fill="#EFF2F9">Demanda de Dinero</text>
  <text x="104" y="62" text-anchor="middle" font-family="JetBrains Mono" font-weight="600" font-size="12" fill="#FF6F4A">M<tspan baseline-shift="super" font-size="8">d</tspan> = $Y &#183; L(i)</text>

  <!-- Bifurcación: Flechas hacia Efectivo y Depósitos -->
  <path d="M 184 42 H 224 V 95 H 250" fill="none" stroke="#A3AABE" stroke-width="1.4" stroke-dasharray="3 3"/>
  <path d="M 244 92 L 250 95 L 244 98" fill="none" stroke="#A3AABE" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="210" y="78" font-family="JetBrains Mono" font-size="9" fill="#A3AABE">c</text>

  <path d="M 184 58 H 224 V 165 H 250" fill="none" stroke="#A3AABE" stroke-width="1.4" stroke-dasharray="3 3"/>
  <path d="M 244 162 L 250 165 L 244 168" fill="none" stroke="#A3AABE" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="202" y="148" font-family="JetBrains Mono" font-size="9" fill="#A3AABE">1 - c</text>

  <!-- Nivel 2A: Demanda de Efectivo CUd -->
  <rect x="250" y="72" width="140" height="46" rx="6" fill="#1B223C" stroke="#667FDA" stroke-width="1.2"/>
  <text x="320" y="89" text-anchor="middle" font-family="Inter" font-size="10" fill="#A3AABE">Efectivo del público</text>
  <text x="320" y="105" text-anchor="middle" font-family="JetBrains Mono" font-weight="600" font-size="11" fill="#667FDA">CU<tspan baseline-shift="super" font-size="7">d</tspan> = c &#183; M<tspan baseline-shift="super" font-size="7">d</tspan></text>

  <!-- Nivel 2B: Demanda de Depósitos Dd -->
  <rect x="250" y="142" width="140" height="46" rx="6" fill="#1B223C" stroke="#2A324A" stroke-width="1.2"/>
  <text x="320" y="159" text-anchor="middle" font-family="Inter" font-size="10" fill="#A3AABE">Depósitos a la vista</text>
  <text x="320" y="175" text-anchor="middle" font-family="JetBrains Mono" font-weight="600" font-size="11" fill="#EFF2F9">D<tspan baseline-shift="super" font-size="7">d</tspan> = (1-c)M<tspan baseline-shift="super" font-size="7">d</tspan></text>

  <!-- Flecha de Depósitos a Reservas Bancarias -->
  <path d="M 320 188 V 206" fill="none" stroke="#FFB188" stroke-width="1.4"/>
  <path d="M 317 202 L 320 206 L 323 202" fill="none" stroke="#FFB188" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="330" y="200" font-family="JetBrains Mono" font-size="8.5" fill="#FFB188">&#215; &#952; (encaje)</text>

  <!-- Nivel 3: Demanda de Reservas Rd -->
  <rect x="240" y="210" width="160" height="46" rx="6" fill="#1B223C" stroke="#FFB188" stroke-width="1.2"/>
  <text x="320" y="227" text-anchor="middle" font-family="Inter" font-size="10" fill="#A3AABE">Reservas de los bancos</text>
  <text x="320" y="243" text-anchor="middle" font-family="JetBrains Mono" font-weight="600" font-size="10.5" fill="#FFB188">R<tspan baseline-shift="super" font-size="7">d</tspan> = &#952;(1-c)M<tspan baseline-shift="super" font-size="7">d</tspan></text>

  <!-- Convergencia a Demanda de Dinero Central Hd -->
  <path d="M 390 95 H 415 V 130 H 425" fill="none" stroke="#FF6F4A" stroke-width="1.5"/>
  <path d="M 400 233 H 415 V 150 H 425" fill="none" stroke="#FF6F4A" stroke-width="1.5"/>
  <path d="M 420 137 L 426 140 L 420 143" fill="none" stroke="#FF6F4A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Nivel Final: Demanda de Dinero del Banco Central Hd -->
  <rect x="426" y="105" width="94" height="70" rx="8" fill="#080C1C" stroke="#FF6F4A" stroke-width="1.5"/>
  <text x="473" y="124" text-anchor="middle" font-family="Inter" font-weight="600" font-size="9.5" fill="#EFF2F9">Demanda de H</text>
  <text x="473" y="142" text-anchor="middle" font-family="JetBrains Mono" font-weight="600" font-size="12" fill="#FF6F4A">H<tspan baseline-shift="super" font-size="8">d</tspan></text>
  <text x="473" y="160" text-anchor="middle" font-family="JetBrains Mono" font-size="8" fill="#A3AABE">= CU<tspan baseline-shift="super" font-size="6">d</tspan> + R<tspan baseline-shift="super" font-size="6">d</tspan></text>

  <!-- Fórmula Resumen Inferior Izquierda: Multiplicador Monetario -->
  <rect x="24" y="210" width="195" height="46" rx="6" fill="#080C1C" stroke="#2A324A" stroke-width="1"/>
  <text x="121" y="226" text-anchor="middle" font-family="Inter" font-size="9" fill="#A3AABE">Multiplicador del dinero (M / H):</text>
  <text x="121" y="244" text-anchor="middle" font-family="JetBrains Mono" font-weight="600" font-size="10.5" fill="#55C975">M = [ 1 / (c + &#952;(1-c)) ] &#183; H</text>
</svg>
