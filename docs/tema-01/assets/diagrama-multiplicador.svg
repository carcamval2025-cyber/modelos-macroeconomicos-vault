<svg viewBox="0 0 540 280" role="img" aria-labelledby="fig-mult-title fig-mult-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="fig-mult-title">Flujo del Multiplicador Monetario y Demanda de Dinero Central</title>
  <desc id="fig-mult-desc">Diagrama de árbol de decisiones financieras que desglosa la demanda agregada de dinero Md en efectivo c*Md y depósitos (1-c)*Md. Los depósitos generan demanda de reservas theta*(1-c)*Md. Ambas ramas convergen en la demanda de dinero central Hd = [c + theta(1-c)]Md, originando el multiplicador monetario.</desc>

  <!-- Contenedor Principal -->
  <rect x="8" y="8" width="524" height="264" rx="12" fill="#1A1B1D" stroke="#3A3C41" stroke-width="1.2"/>

  <!-- Nivel 1: Demanda Total de Dinero Md -->
  <rect x="20" y="24" width="168" height="52" rx="8" fill="#202124" stroke="#F2552C" stroke-width="1.4"/>
  <text x="104" y="44" text-anchor="middle" font-family="Archivo, sans-serif" font-weight="600" font-size="11" fill="#F2F2F0">Demanda de Dinero</text>
  <text x="104" y="62" text-anchor="middle" font-family="Azeret Mono, monospace" font-weight="600" font-size="12" fill="#F2552C">M<tspan baseline-shift="super" font-size="8">d</tspan> = $Y &#183; L(i)</text>

  <!-- Bifurcación: Flechas hacia Efectivo y Depósitos -->
  <path d="M 188 42 H 224 V 95 H 250" fill="none" stroke="#A9ABAE" stroke-width="1.4" stroke-dasharray="3 3"/>
  <path d="M 244 92 L 250 95 L 244 98" fill="none" stroke="#A9ABAE" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Pastilla protectora para c -->
  <rect x="206" y="66" width="18" height="18" rx="4" fill="#1A1B1D" stroke="#3A3C41" stroke-width="0.8"/>
  <text x="215" y="79" text-anchor="middle" font-family="Azeret Mono, monospace" font-size="10" font-weight="600" fill="#FF9B7D">c</text>

  <path d="M 188 58 H 224 V 165 H 250" fill="none" stroke="#A9ABAE" stroke-width="1.4" stroke-dasharray="3 3"/>
  <path d="M 244 162 L 250 165 L 244 168" fill="none" stroke="#A9ABAE" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Pastilla protectora para 1-c -->
  <rect x="195" y="136" width="38" height="18" rx="4" fill="#1A1B1D" stroke="#3A3C41" stroke-width="0.8"/>
  <text x="214" y="149" text-anchor="middle" font-family="Azeret Mono, monospace" font-size="9" font-weight="600" fill="#F2F2F0">1 - c</text>

  <!-- Nivel 2A: Demanda de Efectivo CUd -->
  <rect x="250" y="72" width="144" height="46" rx="6" fill="#202124" stroke="#5C9DFF" stroke-width="1.2"/>
  <text x="322" y="89" text-anchor="middle" font-family="Archivo, sans-serif" font-size="10" fill="#A9ABAE">Efectivo del público</text>
  <text x="322" y="105" text-anchor="middle" font-family="Azeret Mono, monospace" font-weight="600" font-size="11" fill="#5C9DFF">CU<tspan baseline-shift="super" font-size="7">d</tspan> = c &#183; M<tspan baseline-shift="super" font-size="7">d</tspan></text>

  <!-- Nivel 2B: Demanda de Depósitos Dd -->
  <rect x="250" y="142" width="144" height="46" rx="6" fill="#202124" stroke="#3A3C41" stroke-width="1.2"/>
  <text x="322" y="159" text-anchor="middle" font-family="Archivo, sans-serif" font-size="10" fill="#A9ABAE">Depósitos a la vista</text>
  <text x="322" y="175" text-anchor="middle" font-family="Azeret Mono, monospace" font-weight="600" font-size="11" fill="#F2F2F0">D<tspan baseline-shift="super" font-size="7">d</tspan> = (1-c)M<tspan baseline-shift="super" font-size="7">d</tspan></text>

  <!-- Flecha de Depósitos a Reservas Bancarias -->
  <path d="M 322 188 V 208" fill="none" stroke="#FF9B7D" stroke-width="1.4"/>
  <path d="M 319 204 L 322 208 L 325 204" fill="none" stroke="#FF9B7D" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Pastilla protectora para encaje theta -->
  <rect x="330" y="188" width="70" height="18" rx="4" fill="#1A1B1D" stroke="#3A3C41" stroke-width="0.8"/>
  <text x="365" y="201" text-anchor="middle" font-family="Azeret Mono, monospace" font-size="8.5" fill="#FF9B7D">&#215; &#952; (encaje)</text>

  <!-- Nivel 3: Demanda de Reservas Rd -->
  <rect x="240" y="210" width="164" height="46" rx="6" fill="#202124" stroke="#FF9B7D" stroke-width="1.2"/>
  <text x="322" y="227" text-anchor="middle" font-family="Archivo, sans-serif" font-size="10" fill="#A9ABAE">Reservas de los bancos</text>
  <text x="322" y="243" text-anchor="middle" font-family="Azeret Mono, monospace" font-weight="600" font-size="10.5" fill="#FF9B7D">R<tspan baseline-shift="super" font-size="7">d</tspan> = &#952;(1-c)M<tspan baseline-shift="super" font-size="7">d</tspan></text>

  <!-- Convergencia a Demanda de Dinero Central Hd -->
  <path d="M 394 95 H 418 V 130 H 426" fill="none" stroke="#F2552C" stroke-width="1.5"/>
  <path d="M 404 233 H 418 V 150 H 426" fill="none" stroke="#F2552C" stroke-width="1.5"/>
  <path d="M 421 137 L 427 140 L 421 143" fill="none" stroke="#F2552C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Nivel Final: Demanda de Dinero del Banco Central Hd -->
  <rect x="428" y="105" width="94" height="70" rx="8" fill="#101112" stroke="#F2552C" stroke-width="1.5"/>
  <text x="475" y="124" text-anchor="middle" font-family="Archivo, sans-serif" font-weight="600" font-size="9.5" fill="#F2F2F0">Demanda de H</text>
  <text x="475" y="142" text-anchor="middle" font-family="Azeret Mono, monospace" font-weight="600" font-size="12" fill="#F2552C">H<tspan baseline-shift="super" font-size="8">d</tspan></text>
  <text x="475" y="160" text-anchor="middle" font-family="Azeret Mono, monospace" font-size="8" fill="#A9ABAE">= CU<tspan baseline-shift="super" font-size="6">d</tspan> + R<tspan baseline-shift="super" font-size="6">d</tspan></text>

  <!-- Fórmula Resumen Inferior Izquierda: Multiplicador Monetario -->
  <rect x="20" y="210" width="202" height="46" rx="6" fill="#101112" stroke="#3A3C41" stroke-width="1"/>
  <text x="121" y="226" text-anchor="middle" font-family="Archivo, sans-serif" font-size="9" fill="#A9ABAE">Multiplicador del dinero (M / H):</text>
  <text x="121" y="244" text-anchor="middle" font-family="Azeret Mono, monospace" font-weight="600" font-size="10.5" fill="#55C975">M = [ 1 / (c + &#952;(1-c)) ] &#183; H</text>
</svg>
