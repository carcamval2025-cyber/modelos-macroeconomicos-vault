<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 370" role="img" aria-label="Regla de decisión de arbitraje de la Paridad Descubierta de Tasas de Interés">
  <title>Regla de Decisión UIP: Relación entre Tasas y Expectativas Cambiarias</title>
  <desc>Guía visual de arbitraje para la ecuación aproximada i ≈ i* − (Ee - E)/E, mostrando cómo la tasa doméstica se posiciona respecto a la extranjera según exista expectativa de depreciación, neutralidad o apreciación cambiaria.</desc>

  <rect width="820" height="370" rx="14" fill="#1A1B1D" stroke="#3A3C41" stroke-width="1.2"/>
  <path d="M40 45H780M40 325H780" fill="none" stroke="#3A3C41" stroke-width="0.8" stroke-dasharray="4 6" opacity=".4"/>

  <!-- Encabezado superior -->
  <g transform="translate(40, 24)">
    <rect width="740" height="46" rx="8" fill="#101112" stroke="#3A3C41" stroke-width="1"/>
    <text x="20" y="28" font-family="Archivo, sans-serif" font-size="12" font-weight="700" fill="#F2F2F0">REGLA DE DECISIÓN UIP (ECUACIÓN 17.4):</text>
    <rect x="310" y="8" width="165" height="30" rx="6" fill="#202124" stroke="#5C9DFF" stroke-width="1.2"/>
    <text x="392" y="28" text-anchor="middle" font-family="Azeret Mono, monospace" font-size="13" font-weight="700" fill="#F2F2F0">i ≈ i* − %ΔE<tspan font-size="9" dy="-3">e</tspan></text>
    <text x="495" y="28" font-family="Archivo, sans-serif" font-size="11" fill="#A9ABAE">Arbitraje financiero internacional continuo</text>
  </g>

  <!-- Tarjeta 1: Depreciación esperada -->
  <g transform="translate(40, 85)">
    <rect width="234" height="236" rx="10" fill="#101112" stroke="#F2552C" stroke-width="1.5"/>
    <rect x="14" y="14" width="115" height="22" rx="5" fill="#202124" stroke="#F2552C" stroke-width="1"/>
    <text x="71" y="29" text-anchor="middle" font-family="Archivo, sans-serif" font-size="9" font-weight="700" fill="#F2552C">EJERCICIO 1</text>
    <text x="14" y="58" font-family="Archivo, sans-serif" font-size="12" font-weight="700" fill="#F2F2F0">Depreciación esperada</text>
    <text x="14" y="76" font-family="Archivo, sans-serif" font-size="10" fill="#A9ABAE">Expectativa: %ΔE<tspan font-size="8" dy="-2">e</tspan><tspan font-size="10" dy="2"> &gt; 0</tspan></text>

    <!-- Caja de impacto -->
    <rect x="14" y="92" width="206" height="52" rx="6" fill="#1A1B1D" stroke="#3A3C41" stroke-width="0.8"/>
    <text x="24" y="114" font-family="Azeret Mono, monospace" font-size="13" font-weight="700" fill="#F2552C">i &lt; i* (o i* &gt; i)</text>
    <text x="24" y="132" font-family="Archivo, sans-serif" font-size="10" fill="#F2F2F0">Tasa foránea compensa</text>

    <text x="14" y="165" font-family="Archivo, sans-serif" font-size="10" fill="#A9ABAE">El bono extranjero debe pagar</text>
    <text x="14" y="180" font-family="Archivo, sans-serif" font-size="10" fill="#A9ABAE">más para cubrir la depreciación.</text>

    <rect x="14" y="196" width="206" height="26" rx="5" fill="#202124" stroke="#F2552C" stroke-width="0.8"/>
    <text x="117" y="213" text-anchor="middle" font-family="Archivo, sans-serif" font-size="9.5" font-weight="600" fill="#FF9B7D">Premio cambiario foráneo</text>
  </g>

  <!-- Tarjeta 2: Neutralidad cambiaria -->
  <g transform="translate(293, 85)">
    <rect width="234" height="236" rx="10" fill="#101112" stroke="#5C9DFF" stroke-width="1.5"/>
    <rect x="14" y="14" width="125" height="22" rx="5" fill="#202124" stroke="#5C9DFF" stroke-width="1"/>
    <text x="76" y="29" text-anchor="middle" font-family="Archivo, sans-serif" font-size="9" font-weight="700" fill="#5C9DFF">TIPO CAMBIO FIJO</text>
    <text x="14" y="58" font-family="Archivo, sans-serif" font-size="12" font-weight="700" fill="#F2F2F0">Neutralidad esperada</text>
    <text x="14" y="76" font-family="Archivo, sans-serif" font-size="10" fill="#A9ABAE">Expectativa: %ΔE<tspan font-size="8" dy="-2">e</tspan><tspan font-size="10" dy="2"> = 0</tspan></text>

    <!-- Caja de impacto -->
    <rect x="14" y="92" width="206" height="52" rx="6" fill="#1A1B1D" stroke="#3A3C41" stroke-width="0.8"/>
    <text x="24" y="114" font-family="Azeret Mono, monospace" font-size="13" font-weight="700" fill="#5C9DFF">i ≈ i*</text>
    <text x="24" y="132" font-family="Archivo, sans-serif" font-size="10" fill="#F2F2F0">Igualdad absoluta de tasas</text>

    <text x="14" y="165" font-family="Archivo, sans-serif" font-size="10" fill="#A9ABAE">Sin riesgo cambiario esperado,</text>
    <text x="14" y="180" font-family="Archivo, sans-serif" font-size="10" fill="#A9ABAE">las tasas convergen al 100%.</text>

    <rect x="14" y="196" width="206" height="26" rx="5" fill="#202124" stroke="#5C9DFF" stroke-width="0.8"/>
    <text x="117" y="213" text-anchor="middle" font-family="Archivo, sans-serif" font-size="9.5" font-weight="600" fill="#5C9DFF">Equilibrio sin diferencial</text>
  </g>

  <!-- Tarjeta 3: Apreciación esperada -->
  <g transform="translate(546, 85)">
    <rect width="234" height="236" rx="10" fill="#101112" stroke="#55C975" stroke-width="1.5"/>
    <rect x="14" y="14" width="115" height="22" rx="5" fill="#202124" stroke="#55C975" stroke-width="1"/>
    <text x="71" y="29" text-anchor="middle" font-family="Archivo, sans-serif" font-size="9" font-weight="700" fill="#55C975">EJERCICIO 2</text>
    <text x="14" y="58" font-family="Archivo, sans-serif" font-size="12" font-weight="700" fill="#F2F2F0">Apreciación esperada</text>
    <text x="14" y="76" font-family="Archivo, sans-serif" font-size="10" fill="#A9ABAE">Expectativa: %ΔE<tspan font-size="8" dy="-2">e</tspan><tspan font-size="10" dy="2"> &lt; 0</tspan></text>

    <!-- Caja de impacto -->
    <rect x="14" y="92" width="206" height="52" rx="6" fill="#1A1B1D" stroke="#3A3C41" stroke-width="0.8"/>
    <text x="24" y="114" font-family="Azeret Mono, monospace" font-size="13" font-weight="700" fill="#55C975">i &gt; i*</text>
    <text x="24" y="132" font-family="Archivo, sans-serif" font-size="10" fill="#F2F2F0">Tasa doméstica superior</text>

    <text x="14" y="165" font-family="Archivo, sans-serif" font-size="10" fill="#A9ABAE">Bono doméstico debe pagar más</text>
    <text x="14" y="180" font-family="Archivo, sans-serif" font-size="10" fill="#A9ABAE">para retener al inversionista.</text>

    <rect x="14" y="196" width="206" height="26" rx="5" fill="#202124" stroke="#55C975" stroke-width="0.8"/>
    <text x="117" y="213" text-anchor="middle" font-family="Archivo, sans-serif" font-size="9.5" font-weight="600" fill="#55C975">Defensa de activos locales</text>
  </g>

  <!-- Pie explicativo -->
  <text x="410" y="348" text-anchor="middle" font-family="Archivo, sans-serif" font-size="10.5" fill="#A9ABAE">Alerta de signo: En i ≈ i* − %ΔEe, restar una apreciación negativa equivale a sumar: i ≈ i* − (−x%) = i* + x%.</text>
</svg>
