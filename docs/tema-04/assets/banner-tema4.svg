<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 320" role="img" aria-label="Banner panorámico del Tema 4: Apertura Comercial y Financiera: flujos de bienes y arbitraje de capitales">
  <title>Tema 4: Apertura Comercial y Financiera: Economía Abierta</title>
  <desc>Composición panorámica técnica mostrando los dos polos macroeconómicos (economía doméstica e internacional) conectados por los canales de movilidad de bienes (tipo de cambio real epsilon) y movilidad de capitales (paridad de tasas de interés UIP) con tipografía espaciada y protegida.</desc>

  <!-- Fondo base -->
  <rect width="1600" height="320" fill="#101112"/>

  <!-- Retícula técnica y guías cartesianas -->
  <path d="M0 40H1600M0 280H1600" fill="none" stroke="#3A3C41" stroke-width="1.2" opacity=".4"/>
  <path d="M200 30V290M400 30V290M600 30V290M800 30V290M1000 30V290M1200 30V290M1400 30V290" fill="none" stroke="#3A3C41" stroke-width="1" stroke-dasharray="3 6" opacity=".25"/>
  <path d="M100 36V44M300 36V44M500 36V44M700 36V44M900 36V44M1100 36V44M1300 36V44M1500 36V44" fill="none" stroke="#A9ABAE" stroke-width="1" opacity=".2"/>
  <path d="M100 276V284M300 276V284M500 276V284M700 276V284M900 276V284M1100 276V284M1300 276V284M1500 276V284" fill="none" stroke="#A9ABAE" stroke-width="1" opacity=".2"/>

  <!-- Haces de interconexión global de fondo (apertura) -->
  <path d="M280 160C450 60 1150 60 1320 160" fill="none" stroke="#F2552C" stroke-width="2.5" stroke-dasharray="6 6" opacity=".35"/>
  <path d="M280 160C450 260 1150 260 1320 160" fill="none" stroke="#5C9DFF" stroke-width="2.5" stroke-dasharray="6 6" opacity=".35"/>

  <!-- Eje de intercambio comercial (superior) -->
  <path d="M360 135C520 85 700 80 800 80S1080 85 1240 135" fill="none" stroke="#FF9B7D" stroke-width="3" stroke-linecap="round" opacity=".85"/>
  <path d="M1230 128L1240 135L1228 141" fill="none" stroke="#FF9B7D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1240 145C1080 95 900 90 800 90S520 95 360 145" fill="none" stroke="#F2552C" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round" opacity=".7"/>
  <path d="M370 152L360 145L372 139" fill="none" stroke="#F2552C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Eje de arbitraje financiero / UIP (inferior) -->
  <path d="M360 185C520 235 700 240 800 240S1080 235 1240 185" fill="none" stroke="#5C9DFF" stroke-width="3" stroke-linecap="round" opacity=".9"/>
  <path d="M1230 178L1240 185L1228 191" fill="none" stroke="#5C9DFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1240 175C1080 225 900 230 800 230S520 225 360 175" fill="none" stroke="#F2F2F0" stroke-width="1.8" stroke-dasharray="5 5" stroke-linecap="round" opacity=".65"/>
  <path d="M370 168L360 175L372 181" fill="none" stroke="#F2F2F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Polo 1: ECONOMÍA DOMÉSTICA (Índigo) -->
  <g transform="translate(280, 160)">
    <circle cx="0" cy="0" r="76" fill="#1A1B1D" stroke="#3A3C41" stroke-width="1.5" opacity=".5"/>
    <circle cx="0" cy="0" r="58" fill="#101112" stroke="#5C9DFF" stroke-width="2.2" opacity=".85"/>
    <circle cx="0" cy="0" r="42" fill="#1A1B1D" stroke="#5C9DFF" stroke-width="1.2" stroke-dasharray="4 4" opacity=".9"/>
    <circle cx="0" cy="0" r="14" fill="#101112" stroke="#F2F2F0" stroke-width="2.8"/>
    <circle cx="0" cy="0" r="6" fill="#5C9DFF"/>

    <!-- Pastillas informativas Polo Doméstico -->
    <rect x="-105" y="-112" width="210" height="24" rx="5" fill="#1A1B1D" stroke="#5C9DFF" stroke-width="1"/>
    <text x="0" y="-96" text-anchor="middle" font-family="Archivo, sans-serif" font-size="12" font-weight="700" fill="#F2F2F0" letter-spacing="0.06em">ECONOMÍA DOMÉSTICA</text>

    <rect x="-100" y="76" width="94" height="22" rx="4" fill="#1A1B1D" stroke="#3A3C41" stroke-width="0.8"/>
    <text x="-53" y="91" text-anchor="middle" font-family="Azeret Mono, monospace" font-size="10.5" fill="#5C9DFF">P (Precios)</text>

    <rect x="6" y="76" width="94" height="22" rx="4" fill="#1A1B1D" stroke="#3A3C41" stroke-width="0.8"/>
    <text x="53" y="91" text-anchor="middle" font-family="Azeret Mono, monospace" font-size="10.5" fill="#F2F2F0">i (Tasa)</text>
  </g>

  <!-- Polo 2: RESTO DEL MUNDO / ECONOMÍA EXTRANJERA (Coral) -->
  <g transform="translate(1320, 160)">
    <circle cx="0" cy="0" r="76" fill="#1A1B1D" stroke="#3A3C41" stroke-width="1.5" opacity=".5"/>
    <circle cx="0" cy="0" r="58" fill="#101112" stroke="#F2552C" stroke-width="2.2" opacity=".85"/>
    <circle cx="0" cy="0" r="42" fill="#1A1B1D" stroke="#F2552C" stroke-width="1.2" stroke-dasharray="4 4" opacity=".9"/>
    <circle cx="0" cy="0" r="14" fill="#101112" stroke="#F2F2F0" stroke-width="2.8"/>
    <circle cx="0" cy="0" r="6" fill="#F2552C"/>

    <!-- Pastillas informativas Polo Extranjero -->
    <rect x="-105" y="-112" width="210" height="24" rx="5" fill="#1A1B1D" stroke="#F2552C" stroke-width="1"/>
    <text x="0" y="-96" text-anchor="middle" font-family="Archivo, sans-serif" font-size="12" font-weight="700" fill="#F2F2F0" letter-spacing="0.06em">RESTO DEL MUNDO</text>

    <rect x="-100" y="76" width="94" height="22" rx="4" fill="#1A1B1D" stroke="#3A3C41" stroke-width="0.8"/>
    <text x="-53" y="91" text-anchor="middle" font-family="Azeret Mono, monospace" font-size="10.5" fill="#F2552C">P* (Precios)</text>

    <rect x="6" y="76" width="94" height="22" rx="4" fill="#1A1B1D" stroke="#3A3C41" stroke-width="0.8"/>
    <text x="53" y="91" text-anchor="middle" font-family="Azeret Mono, monospace" font-size="10.5" fill="#FF9B7D">i* (Tasa)</text>
  </g>

  <!-- NODO CENTRAL SUPERIOR: Tipo de Cambio Real ε -->
  <g transform="translate(800, 80)">
    <rect x="-145" y="-22" width="290" height="44" rx="9" fill="#1A1B1D" stroke="#FF9B7D" stroke-width="1.4"/>
    <circle cx="-115" cy="0" r="12" fill="#101112" stroke="#F2552C" stroke-width="2"/>
    <text x="-115" y="5" text-anchor="middle" font-family="Azeret Mono, monospace" font-size="14" font-weight="700" fill="#F2552C">ε</text>
    <text x="15" y="-4" text-anchor="middle" font-family="Archivo, sans-serif" font-size="11" font-weight="600" fill="#F2F2F0">TIPO DE CAMBIO REAL</text>
    <text x="15" y="14" text-anchor="middle" font-family="Azeret Mono, monospace" font-size="12" fill="#FF9B7D">ε = (E · P) / P*</text>
  </g>

  <!-- NODO CENTRAL INFERIOR: Paridad de Tasas de Interés (UIP) -->
  <g transform="translate(800, 240)">
    <rect x="-205" y="-22" width="410" height="44" rx="9" fill="#1A1B1D" stroke="#5C9DFF" stroke-width="1.4"/>
    <circle cx="-172" cy="0" r="12" fill="#101112" stroke="#5C9DFF" stroke-width="2"/>
    <text x="-172" y="5" text-anchor="middle" font-family="Azeret Mono, monospace" font-size="11.5" font-weight="700" fill="#5C9DFF">UIP</text>
    <text x="15" y="-4" text-anchor="middle" font-family="Archivo, sans-serif" font-size="11" font-weight="600" fill="#F2F2F0">PARIDAD DE TASAS NO CUBIERTA</text>
    <text x="15" y="14" text-anchor="middle" font-family="Azeret Mono, monospace" font-size="11.5" fill="#F2F2F0">(1 + i<tspan font-size="9">t</tspan>) = (1 + i*<tspan font-size="9">t</tspan>) · (E<tspan font-size="9">t</tspan> / E<tspan font-size="9">t+1</tspan><tspan font-size="8" dy="-4">e</tspan><tspan font-size="11.5" dy="4">)</tspan></text>
  </g>

  <!-- Centro conector de Balanza de Pagos -->
  <g transform="translate(800, 160)">
    <circle cx="0" cy="0" r="22" fill="#101112" stroke="#3A3C41" stroke-width="1.6"/>
    <circle cx="0" cy="0" r="16" fill="#1A1B1D" stroke="#F2F2F0" stroke-width="1.8"/>
    <text x="0" y="4" text-anchor="middle" font-family="Azeret Mono, monospace" font-size="10" font-weight="700" fill="#55C975">BP</text>
    <rect x="-85" y="-34" width="170" height="18" rx="4" fill="#101112" stroke="#3A3C41" stroke-width="0.8"/>
    <text x="0" y="-21" text-anchor="middle" font-family="Azeret Mono, monospace" font-size="9.5" fill="#A9ABAE">CC + CF ≈ 0</text>
  </g>

  <!-- Marcadores laterales decorativos de metadatos -->
  <text x="40" y="298" font-family="Azeret Mono, monospace" font-size="10" fill="#A9ABAE" opacity=".6">ESEN · MACRO II · BLANCHARD CAP. 17</text>
  <text x="1560" y="298" text-anchor="end" font-family="Azeret Mono, monospace" font-size="10" fill="#A9ABAE" opacity=".6">MERCADO DE BIENES + MERCADO FINANCIERO</text>
</svg>
