<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 370" role="img" aria-label="Diagrama conceptual de la dinámica y determinantes del tipo de cambio real: canal nominal, canal inflación y política comercial">
  <title>Dinámica y Determinantes del Tipo de Cambio Real</title>
  <desc>Descomposición analítica de la fórmula ε = EP/P* mostrando los tres canales de transmisión: variación nominal del tipo de cambio, diferencial inflacionario relativo y restricciones comerciales directas como cuotas y aranceles.</desc>

  <rect width="820" height="370" rx="14" fill="#1A1B1D" stroke="#3A3C41" stroke-width="1.2"/>
  <path d="M40 45H780M40 325H780" fill="none" stroke="#3A3C41" stroke-width="0.8" stroke-dasharray="4 6" opacity=".4"/>

  <!-- Encabezado superior / Ecuación maestra -->
  <g transform="translate(40, 24)">
    <rect width="740" height="46" rx="8" fill="#101112" stroke="#3A3C41" stroke-width="1"/>
    <text x="20" y="28" font-family="Archivo, sans-serif" font-size="12" font-weight="700" fill="#F2F2F0">DETERMINANTES DE LA ECUACIÓN (17.1):</text>
    <rect x="290" y="8" width="130" height="30" rx="6" fill="#202124" stroke="#5C9DFF" stroke-width="1.2"/>
    <text x="355" y="28" text-anchor="middle" font-family="Azeret Mono, monospace" font-size="14" font-weight="700" fill="#F2F2F0">ε = E · P / P*</text>
    <text x="440" y="28" font-family="Archivo, sans-serif" font-size="11" fill="#A9ABAE">Precio relativo de los bienes domésticos frente a los extranjeros</text>
  </g>

  <!-- Tarjeta 1: Canal Nominal -->
  <g transform="translate(40, 85)">
    <rect width="234" height="236" rx="10" fill="#101112" stroke="#5C9DFF" stroke-width="1.5"/>
    <rect x="14" y="14" width="115" height="22" rx="5" fill="#202124" stroke="#5C9DFF" stroke-width="1"/>
    <text x="71" y="29" text-anchor="middle" font-family="Archivo, sans-serif" font-size="9" font-weight="700" fill="#5C9DFF">CANAL NOMINAL</text>
    <text x="14" y="58" font-family="Archivo, sans-serif" font-size="12" font-weight="700" fill="#F2F2F0">Variación en E</text>
    <text x="14" y="76" font-family="Archivo, sans-serif" font-size="10" fill="#A9ABAE">Precios P y P* estables</text>

    <!-- Caja de impacto -->
    <rect x="14" y="92" width="206" height="52" rx="6" fill="#1A1B1D" stroke="#3A3C41" stroke-width="0.8"/>
    <text x="24" y="114" font-family="Azeret Mono, monospace" font-size="13" font-weight="700" fill="#55C975">↑ E ⇒ ↑ ε</text>
    <text x="24" y="132" font-family="Archivo, sans-serif" font-size="10" fill="#F2F2F0">Apreciación real directa</text>

    <text x="14" y="165" font-family="Archivo, sans-serif" font-size="10" fill="#A9ABAE">Bienes domésticos son</text>
    <text x="14" y="180" font-family="Archivo, sans-serif" font-size="10" fill="#A9ABAE">más caros para el foráneo.</text>

    <rect x="14" y="196" width="206" height="26" rx="5" fill="#202124" stroke="#FF7382" stroke-width="0.8"/>
    <text x="117" y="213" text-anchor="middle" font-family="Archivo, sans-serif" font-size="9.5" font-weight="600" fill="#FF7382">Erosión de competitividad</text>
  </g>

  <!-- Tarjeta 2: Canal Diferencial Inflacionario -->
  <g transform="translate(293, 85)">
    <rect width="234" height="236" rx="10" fill="#101112" stroke="#F2552C" stroke-width="1.5"/>
    <rect x="14" y="14" width="135" height="22" rx="5" fill="#202124" stroke="#F2552C" stroke-width="1"/>
    <text x="81" y="29" text-anchor="middle" font-family="Archivo, sans-serif" font-size="9" font-weight="700" fill="#F2552C">CANAL INFLACIÓN</text>
    <text x="14" y="58" font-family="Archivo, sans-serif" font-size="12" font-weight="700" fill="#F2F2F0">Diferencial (π - π*)</text>
    <text x="14" y="76" font-family="Archivo, sans-serif" font-size="10" fill="#A9ABAE">Con tipo de cambio fijo (E constante)</text>

    <!-- Caja de impacto -->
    <rect x="14" y="92" width="206" height="52" rx="6" fill="#1A1B1D" stroke="#3A3C41" stroke-width="0.8"/>
    <text x="24" y="114" font-family="Azeret Mono, monospace" font-size="12" font-weight="700" fill="#F2552C">↑ P &gt; ↑ P* ⇒ ↑ ε</text>
    <text x="24" y="132" font-family="Archivo, sans-serif" font-size="10" fill="#F2F2F0">Sobrevaluación real</text>

    <text x="14" y="165" font-family="Archivo, sans-serif" font-size="10" fill="#A9ABAE">Pérdida de competitividad sin</text>
    <text x="14" y="180" font-family="Archivo, sans-serif" font-size="10" fill="#A9ABAE">movimiento nominal alguno.</text>

    <rect x="14" y="196" width="206" height="26" rx="5" fill="#202124" stroke="#FF9B7D" stroke-width="0.8"/>
    <text x="117" y="213" text-anchor="middle" font-family="Archivo, sans-serif" font-size="9.5" font-weight="600" fill="#FF9B7D">Efecto clásico en ancla fija</text>
  </g>

  <!-- Tarjeta 3: Canal Comercial (Cuotas y Aranceles) -->
  <g transform="translate(546, 85)">
    <rect width="234" height="236" rx="10" fill="#101112" stroke="#55C975" stroke-width="1.5"/>
    <rect x="14" y="14" width="135" height="22" rx="5" fill="#202124" stroke="#55C975" stroke-width="1"/>
    <text x="81" y="29" text-anchor="middle" font-family="Archivo, sans-serif" font-size="9" font-weight="700" fill="#55C975">MERCADO DE BIENES</text>
    <text x="14" y="58" font-family="Archivo, sans-serif" font-size="12" font-weight="700" fill="#F2F2F0">Cuotas y Aranceles</text>
    <text x="14" y="76" font-family="Archivo, sans-serif" font-size="10" fill="#A9ABAE">Restricción cuantitativa directa</text>

    <!-- Caja de impacto -->
    <rect x="14" y="92" width="206" height="52" rx="6" fill="#1A1B1D" stroke="#3A3C41" stroke-width="0.8"/>
    <text x="24" y="114" font-family="Azeret Mono, monospace" font-size="12" font-weight="700" fill="#55C975">Cuotas ⇒ ↓ IM</text>
    <text x="24" y="132" font-family="Archivo, sans-serif" font-size="10" fill="#F2F2F0">No altera fórmula de ε</text>

    <text x="14" y="165" font-family="Archivo, sans-serif" font-size="10" fill="#A9ABAE">Restringe apertura comercial,</text>
    <text x="14" y="180" font-family="Archivo, sans-serif" font-size="10" fill="#A9ABAE">pero ε sigue siendo EP/P*.</text>

    <rect x="14" y="196" width="206" height="26" rx="5" fill="#202124" stroke="#55C975" stroke-width="0.8"/>
    <text x="117" y="213" text-anchor="middle" font-family="Archivo, sans-serif" font-size="9.5" font-weight="600" fill="#55C975">Barrera no arancelaria</text>
  </g>

  <!-- Pie explicativo -->
  <text x="410" y="348" text-anchor="middle" font-family="Archivo, sans-serif" font-size="10.5" fill="#A9ABAE">Blanchard Cap. 17: Diferenciar rigurosamente entre movimientos nominales (E), de precios relativos (P/P*) e intervenciones comerciales.</text>
</svg>
