<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" role="img" aria-label="Comparador visual de retornos esperados para el Problema 2: arbitraje entre bono doméstico y bono extranjero">
  <title>Problema 2: Arbitraje y Paridad de Tasas de Interés</title>
  <desc>Comparación visual de retornos esperados con espaciado amplio que demuestra por qué la tasa extranjera i* debe ser 16% cuando la tasa doméstica es 8% y se espera una depreciación del 8%, logrando la igualdad exacta de rendimientos netos esperados.</desc>

  <!-- Contenedor base -->
  <rect width="800" height="350" rx="12" fill="#1A1B1D" stroke="#3A3C41" stroke-width="1.2"/>

  <!-- Trama reticular sutil -->
  <path d="M40 45H760M40 295H760" fill="none" stroke="#3A3C41" stroke-width="0.8" stroke-dasharray="4 6" opacity=".4"/>
  <line x1="330" y1="35" x2="330" y2="295" stroke="#3A3C41" stroke-width="1" stroke-dasharray="4 6" opacity=".25"/>

  <!-- ==================== COLUMNA IZQUIERDA: BONO DOMÉSTICO ==================== -->
  <g transform="translate(40, 40)">
    <!-- Marco de la tarjeta -->
    <rect width="260" height="240" rx="10" fill="#101112" stroke="#F2552C" stroke-width="1.8"/>

    <!-- Cabecera -->
    <rect x="15" y="-12" width="170" height="24" rx="5" fill="#202124" stroke="#F2552C" stroke-width="1.2"/>
    <text x="100" y="4" text-anchor="middle" font-family="Archivo, sans-serif" font-size="11" font-weight="700" fill="#F2F2F0">BONO DOMÉSTICO (X)</text>

    <text x="18" y="26" font-family="Archivo, sans-serif" font-size="10" fill="#A9ABAE">Rendimiento directo en moneda local</text>

    <!-- Fila 1: Tasa de interés -->
    <g transform="translate(16, 44)">
      <rect width="228" height="46" rx="6" fill="#1A1B1D" stroke="#3A3C41" stroke-width="0.8"/>
      <text x="12" y="20" font-family="Archivo, sans-serif" font-size="10" font-weight="600" fill="#A9ABAE">Tasa de interés fija:</text>
      <text x="12" y="37" font-family="Azeret Mono, monospace" font-size="15" font-weight="700" fill="#F2552C">i = 8.0%</text>
      <rect x="150" y="12" width="66" height="22" rx="4" fill="#202124"/>
      <text x="183" y="27" text-anchor="middle" font-family="Archivo, sans-serif" font-size="9" fill="#55C975">Sin riesgo</text>
    </g>

    <!-- Fila 2: Retorno neto esperado -->
    <g transform="translate(16, 108)">
      <rect width="228" height="66" rx="7" fill="#1A1B1D" stroke="#F2552C" stroke-width="1.4"/>
      <text x="12" y="20" font-family="Archivo, sans-serif" font-size="10" font-weight="700" fill="#F2F2F0">RETORNO NETO ESPERADO</text>
      <text x="12" y="44" font-family="Azeret Mono, monospace" font-size="20" font-weight="700" fill="#F2552C">8.0%</text>
      <text x="12" y="58" font-family="Archivo, sans-serif" font-size="9" fill="#55C975">Cero pérdida cambiaria en divisa</text>
    </g>

    <text x="130" y="210" text-anchor="middle" font-family="Archivo, sans-serif" font-size="9.5" fill="#A9ABAE">Paga (1 + 0.08) USD al año t+1</text>
  </g>

  <!-- ==================== SÍMBOLO CENTRAL DE ARBITRAJE ==================== -->
  <g transform="translate(315, 135)">
    <circle cx="15" cy="20" r="18" fill="#202124" stroke="#FF9B7D" stroke-width="1.6"/>
    <text x="15" y="27" text-anchor="middle" font-family="Azeret Mono, monospace" font-size="20" font-weight="700" fill="#F2F2F0">=</text>
    <rect x="-35" y="46" width="100" height="20" rx="4" fill="#101112" stroke="#3A3C41" stroke-width="0.8"/>
    <text x="15" y="60" text-anchor="middle" font-family="Archivo, sans-serif" font-size="8.5" font-weight="600" fill="#FF9B7D">ARBITRAJE</text>
  </g>

  <!-- ==================== COLUMNA DERECHA: BONO EXTRANJERO ==================== -->
  <g transform="translate(365, 40)">
    <!-- Marco de la tarjeta -->
    <rect width="395" height="240" rx="10" fill="#101112" stroke="#5C9DFF" stroke-width="1.8"/>

    <!-- Cabecera -->
    <rect x="15" y="-12" width="190" height="24" rx="5" fill="#202124" stroke="#5C9DFF" stroke-width="1.2"/>
    <text x="110" y="4" text-anchor="middle" font-family="Archivo, sans-serif" font-size="11" font-weight="700" fill="#F2F2F0">BONO EXTRANJERO (*)</text>

    <text x="18" y="26" font-family="Archivo, sans-serif" font-size="10" fill="#A9ABAE">Ruta internacional: tasa foránea menos depreciación</text>

    <!-- Fila 1: Tasa nominal foránea i* = 16% -->
    <g transform="translate(16, 38)">
      <rect width="363" height="34" rx="5" fill="#1A1B1D"/>
      <text x="12" y="21" font-family="Archivo, sans-serif" font-size="10" fill="#F2F2F0">Tasa extranjera bruta (i*):</text>
      <text x="350" y="22" text-anchor="end" font-family="Azeret Mono, monospace" font-size="13" font-weight="700" fill="#55C975">+16.0%</text>
    </g>

    <!-- Fila 2: Pérdida cambiaria esperada -8% (con dos líneas limpias) -->
    <g transform="translate(16, 78)">
      <rect width="363" height="42" rx="5" fill="#1A1B1D"/>
      <text x="12" y="17" font-family="Archivo, sans-serif" font-size="10" fill="#A9ABAE">Depreciación esperada (ΔE<tspan font-size="8" dy="-2">e</tspan><tspan font-size="10" dy="2">/E):</tspan></text>
      <text x="12" y="32" font-family="Azeret Mono, monospace" font-size="9" fill="#A9ABAE">(4.86 − 4.50) / 4.50 = 0.08</text>
      <text x="350" y="26" text-anchor="end" font-family="Azeret Mono, monospace" font-size="13" font-weight="700" fill="#FF7382">−8.0%</text>
    </g>

    <!-- Fila 3: Retorno neto esperado -->
    <g transform="translate(16, 128)">
      <rect width="363" height="52" rx="7" fill="#1A1B1D" stroke="#5C9DFF" stroke-width="1.4"/>
      <text x="12" y="19" font-family="Archivo, sans-serif" font-size="10" font-weight="700" fill="#F2F2F0">RETORNO NETO ESPERADO</text>
      <text x="12" y="38" font-family="Azeret Mono, monospace" font-size="11" fill="#A9ABAE">16.0% − 8.0% =</text>
      <text x="125" y="39" font-family="Azeret Mono, monospace" font-size="18" font-weight="700" fill="#5C9DFF">8.0%</text>
      <rect x="210" y="24" width="142" height="20" rx="4" fill="#202124"/>
      <text x="281" y="38" text-anchor="middle" font-family="Archivo, sans-serif" font-size="9" font-weight="600" fill="#55C975">¡Iguala a ruta local!</text>
    </g>

    <text x="197" y="210" text-anchor="middle" font-family="Archivo, sans-serif" font-size="9.5" fill="#A9ABAE">El 16% extranjero compensa la pérdida cambiaria del 8%</text>
  </g>

  <!-- ==================== FRANJA INFERIOR DE CONCLUSIÓN Y FÓRMULA ==================== -->
  <g transform="translate(40, 298)">
    <rect width="720" height="34" rx="7" fill="#101112" stroke="#3A3C41" stroke-width="1"/>
    <text x="18" y="21" font-family="Archivo, sans-serif" font-size="10" font-weight="700" fill="#FF9B7D">FÓRMULA APLICADA:</text>
    <text x="160" y="21" font-family="Azeret Mono, monospace" font-size="11" fill="#F2F2F0">i ≈ i* − %ΔE<tspan font-size="8" dy="-2">e</tspan><tspan font-size="11" dy="2">  ⇒  i* ≈ i + %ΔE</tspan><tspan font-size="8" dy="-2">e</tspan><tspan font-size="11" dy="2"> = 8.0% + 8.0% = <tspan font-weight="700" fill="#5C9DFF">16.0%</tspan></tspan></text>
  </g>
</svg>
