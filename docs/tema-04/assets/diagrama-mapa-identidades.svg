<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 370" role="img" aria-label="Tríptico de identidades fundamentales del Tema 4: Tipo de Cambio Real, Paridad de Tasas de Interés y Balanza de Pagos">
  <title>Tríptico de Identidades Fundamentales — Tema 4 (Blanchard Cap. 17)</title>
  <desc>Resumen conceptual integrado de las tres ecuaciones centrales de macroeconomía abierta: tipo de cambio real (ε = EP/P*), paridad descubierta de tasas (UIP) y balance contable de pagos (CC + CF ≈ 0).</desc>

  <rect width="820" height="370" rx="14" fill="#10172D" stroke="#2A324A" stroke-width="1.2"/>
  <path d="M40 45H780M40 325H780" fill="none" stroke="#2A324A" stroke-width="0.8" stroke-dasharray="4 6" opacity=".4"/>

  <!-- Encabezado superior -->
  <g transform="translate(40, 24)">
    <rect width="740" height="46" rx="8" fill="#080C1C" stroke="#2A324A" stroke-width="1"/>
    <text x="20" y="28" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#EFF2F9">TRÍPTICO DE IDENTIDADES FUNDAMENTALES</text>
    <rect x="360" y="8" width="130" height="30" rx="6" fill="#1B223C" stroke="#FF6F4A" stroke-width="1.2"/>
    <text x="425" y="28" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#FFB188">CONTROL 2 PREP</text>
    <text x="505" y="28" font-family="Inter, sans-serif" font-size="11" fill="#A3AABE">Blanchard, Macroeconomics 9ª ed., Cap. 17</text>
  </g>

  <!-- Panel 1: Tipo de Cambio Real -->
  <g transform="translate(40, 85)">
    <rect width="234" height="236" rx="10" fill="#080C1C" stroke="#FF6F4A" stroke-width="1.5"/>
    <rect x="14" y="14" width="130" height="22" rx="5" fill="#1B223C" stroke="#FF6F4A" stroke-width="1"/>
    <text x="79" y="29" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#FF6F4A">01 · BIENES (17-1)</text>
    <text x="14" y="58" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#EFF2F9">Tipo de cambio real</text>
    <text x="14" y="76" font-family="Inter, sans-serif" font-size="10" fill="#A3AABE">Precios relativos de canastas</text>

    <!-- Ecuación -->
    <rect x="14" y="92" width="206" height="52" rx="6" fill="#10172D" stroke="#2A324A" stroke-width="0.8"/>
    <text x="117" y="115" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#EFF2F9">ε = E · P / P*</text>
    <text x="117" y="133" text-anchor="middle" font-family="Inter, sans-serif" font-size="9.5" fill="#55C975">↑ε = Apreciación real</text>

    <text x="14" y="165" font-family="Inter, sans-serif" font-size="10" fill="#A3AABE">Un aumento en ε encarece los</text>
    <text x="14" y="180" font-family="Inter, sans-serif" font-size="10" fill="#A3AABE">bienes nacionales para el resto.</text>

    <rect x="14" y="196" width="206" height="26" rx="5" fill="#1B223C" stroke="#FF6F4A" stroke-width="0.8"/>
    <text x="117" y="213" text-anchor="middle" font-family="Inter, sans-serif" font-size="9.5" font-weight="600" fill="#FFB188">Competitividad de bienes</text>
  </g>

  <!-- Panel 2: Paridad de Tasas -->
  <g transform="translate(293, 85)">
    <rect width="234" height="236" rx="10" fill="#080C1C" stroke="#667FDA" stroke-width="1.5"/>
    <rect x="14" y="14" width="130" height="22" rx="5" fill="#1B223C" stroke="#667FDA" stroke-width="1"/>
    <text x="79" y="29" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#667FDA">02 · ACTIVOS (17-2)</text>
    <text x="14" y="58" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#EFF2F9">Paridad de tasas (UIP)</text>
    <text x="14" y="76" font-family="Inter, sans-serif" font-size="10" fill="#A3AABE">Arbitraje financiero internacional</text>

    <!-- Ecuación -->
    <rect x="14" y="92" width="206" height="52" rx="6" fill="#10172D" stroke="#2A324A" stroke-width="0.8"/>
    <text x="117" y="115" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#EFF2F9">(1+i) = (1+i*)·(E/E<tspan font-size="8" dy="-2">e</tspan>)</text>
    <text x="117" y="133" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#667FDA">i ≈ i* − %ΔE<tspan font-size="7" dy="-2">e</tspan></text>

    <text x="14" y="165" font-family="Inter, sans-serif" font-size="10" fill="#A3AABE">Sin costos de transacción, los</text>
    <text x="14" y="180" font-family="Inter, sans-serif" font-size="10" fill="#A3AABE">retornos esperados se igualan.</text>

    <rect x="14" y="196" width="206" height="26" rx="5" fill="#1B223C" stroke="#667FDA" stroke-width="0.8"/>
    <text x="117" y="213" text-anchor="middle" font-family="Inter, sans-serif" font-size="9.5" font-weight="600" fill="#667FDA">Movilidad de capitales</text>
  </g>

  <!-- Panel 3: Balanza de Pagos -->
  <g transform="translate(546, 85)">
    <rect width="234" height="236" rx="10" fill="#080C1C" stroke="#55C975" stroke-width="1.5"/>
    <rect x="14" y="14" width="130" height="22" rx="5" fill="#1B223C" stroke="#55C975" stroke-width="1"/>
    <text x="79" y="29" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#55C975">03 · CUENTAS (17-2)</text>
    <text x="14" y="58" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#EFF2F9">Balanza de pagos</text>
    <text x="14" y="76" font-family="Inter, sans-serif" font-size="10" fill="#A3AABE">Registro contable agregado</text>

    <!-- Ecuación -->
    <rect x="14" y="92" width="206" height="52" rx="6" fill="#10172D" stroke="#2A324A" stroke-width="0.8"/>
    <text x="117" y="115" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#EFF2F9">CC + CF ≈ 0</text>
    <text x="117" y="133" text-anchor="middle" font-family="Inter, sans-serif" font-size="9.5" fill="#EFF2F9">NX + NI + CF ≈ 0</text>

    <text x="14" y="165" font-family="Inter, sans-serif" font-size="10" fill="#A3AABE">Todo déficit de cuenta corriente</text>
    <text x="14" y="180" font-family="Inter, sans-serif" font-size="10" fill="#A3AABE">se financia con superávit de CF.</text>

    <rect x="14" y="196" width="206" height="26" rx="5" fill="#1B223C" stroke="#55C975" stroke-width="0.8"/>
    <text x="117" y="213" text-anchor="middle" font-family="Inter, sans-serif" font-size="9.5" font-weight="600" fill="#55C975">Financiamiento externo</text>
  </g>

  <!-- Pie explicativo -->
  <text x="410" y="348" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" fill="#A3AABE">Las tres identidades conectan simultáneamente los flujos reales de comercio, los flujos financieros y la contabilidad externa.</text>
</svg>
